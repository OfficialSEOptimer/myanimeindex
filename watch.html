<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Watch anime episodes in HD with sub and dub.">
  <title>Watch - NekoStream</title>
  <style>
    :root{--bg:#050505;--surface:rgba(15,15,15,0.9);--primary:#a855f7;--primary-glow:rgba(168,85,247,0.35);--text:#f5f5f5;--text-secondary:#a1a1aa;--radius:14px;--header-height:56px;--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom)}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{overflow-x:hidden;max-width:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;line-height:1.5;min-height:100dvh}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px}

    .header{position:fixed;top:0;left:0;right:0;height:calc(var(--header-height) + var(--safe-top));padding-top:var(--safe-top);background:rgba(5,5,5,0.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);z-index:1000;display:flex;align-items:center;justify-content:space-between;padding-left:clamp(12px,3vw,32px);padding-right:clamp(12px,3vw,32px);max-width:100vw}
    .header-left,.header-right{display:flex;align-items:center;gap:10px;flex-shrink:0;min-width:0}
    .logo{font-size:clamp(1rem,3vw,1.4rem);font-weight:800;background:linear-gradient(135deg,var(--primary),#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;white-space:nowrap}
    .menu-btn,.search-btn{width:36px;height:36px;border-radius:8px;border:none;background:rgba(255,255,255,0.08);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;touch-action:manipulation}
    .menu-btn:hover,.search-btn:hover{background:var(--primary)}
    .menu-btn svg,.search-btn svg{width:18px;height:18px}

    .mobile-nav{position:fixed;top:0;left:0;bottom:0;width:min(280px,80vw);background:rgba(8,8,8,0.98);backdrop-filter:blur(30px);z-index:1001;transform:translateX(-100%);transition:transform .35s cubic-bezier(0.4,0,0.2,1);border-right:1px solid rgba(255,255,255,0.06);overflow-y:auto;padding:28px 24px}
    .mobile-nav.open{transform:translateX(0)}
    .mobile-nav-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s}
    .mobile-nav-overlay.open{opacity:1;pointer-events:auto}
    .nav-link{display:block;padding:14px 0;color:var(--text-secondary);text-decoration:none;font-weight:500;border-bottom:1px solid rgba(255,255,255,0.05);transition:color .2s}
    .nav-link:hover{color:var(--primary)}

    /* Watch Layout */
    .watch-layout{padding:calc(var(--header-height) + 12px) clamp(10px,2.5vw,32px) 24px;max-width:1400px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:20px}
    @media(min-width:1024px){.watch-layout{grid-template-columns:minmax(0,1fr) 320px;gap:24px}}

    .player-area{min-width:0;background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1px solid rgba(255,255,255,0.06)}
    .player-wrap{position:relative;width:100%;padding-top:56.25%;background:#000}
    .player-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
    .player-controls{display:flex;flex-wrap:wrap;gap:10px;padding:12px;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.05)}
    .control-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .btn-sm{padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:var(--text);cursor:pointer;font-size:.85rem;font-weight:600;transition:all .2s;touch-action:manipulation}
    .btn-sm:hover{border-color:var(--primary);background:rgba(168,85,247,0.12)}
    .btn-sm.active{background:var(--primary);border-color:var(--primary);color:white}

    .episodes-area{padding:16px}
    .episodes-area h3{font-size:1rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .episodes-area h3::before{content:'';width:3px;height:16px;background:var(--primary);border-radius:2px}
    .ep-scroll{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:8px}
    .ep-scroll::-webkit-scrollbar{display:none}
    .ep-pill{flex:0 0 auto;scroll-snap-align:start;padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:var(--text);cursor:pointer;text-decoration:none;font-size:.85rem;font-weight:600;transition:all .2s;touch-action:manipulation}
    .ep-pill:hover{border-color:var(--primary);background:rgba(168,85,247,0.12)}
    .ep-pill.current{background:var(--primary);border-color:var(--primary);color:white}

    /* Sidebar */
    .sidebar{min-width:0;display:flex;flex-direction:column;gap:20px}
    .side-card{background:var(--surface);border-radius:var(--radius);padding:16px;border:1px solid rgba(255,255,255,0.06)}
    .side-card h4{font-size:.95rem;margin-bottom:10px;display:flex;align-items:center;gap:6px}
    .side-card h4::before{content:'';width:3px;height:14px;background:var(--primary);border-radius:2px}
    .side-poster{width:100%;border-radius:10px;aspect-ratio:3/4;object-fit:cover;margin-bottom:12px;background:rgba(255,255,255,0.03)}
    .side-title{font-size:1rem;font-weight:700;margin-bottom:6px;line-height:1.3}
    .side-meta{font-size:.8rem;color:var(--text-secondary);margin-bottom:12px}
    .side-desc{font-size:.85rem;color:var(--text-secondary);line-height:1.6;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

    .related-slider{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
    .related-slider::-webkit-scrollbar{display:none}
    .rel-card{flex:0 0 auto;width:100px;text-decoration:none;color:var(--text)}
    .rel-card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block;background:rgba(255,255,255,0.03)}
    .rel-card .rel-title{font-size:.75rem;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* Theater mode */
    body.theater .watch-layout{max-width:100%;padding-top:0}
    body.theater .header{transform:translateY(-100%);transition:transform .3s}
    body.theater .sidebar{display:none}
    body.theater .player-area{border-radius:0;border:none}
    body.theater:hover .header{transform:translateY(0)}

    .footer{padding:32px clamp(12px,3vw,48px);text-align:center;border-top:1px solid rgba(255,255,255,0.05);margin-top:20px}
    .footer-text{color:var(--text-secondary);font-size:.85rem}
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <a href="index.html" class="logo">NekoStream</a>
    </div>
    <div class="header-right">
      <button class="search-btn" id="searchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
    </div>
  </header>

  <nav class="mobile-nav" id="mobileNav" aria-hidden="true">
    <a href="index.html" class="nav-link">Home</a>
    <a href="search.html" class="nav-link">Search</a>
    <a href="schedule.html" class="nav-link">Schedule</a>
    <a href="creator.html" class="nav-link">Creator</a>
  </nav>
  <div class="mobile-nav-overlay" id="navOverlay"></div>

  <div class="watch-layout" id="watchLayout">
    <div class="main-col">
      <div class="player-area">
        <div class="player-wrap" id="playerWrap"></div>
        <div class="player-controls">
          <div class="control-group">
            <button class="btn-sm" id="prevEp">‹ Prev</button>
            <button class="btn-sm" id="nextEp">Next ›</button>
            <button class="btn-sm" id="autoNext">Auto: ON</button>
          </div>
          <div class="control-group">
            <button class="btn-sm active" id="subBtn">Sub</button>
            <button class="btn-sm" id="dubBtn">Dub</button>
            <button class="btn-sm" id="theaterBtn">Theater</button>
            <button class="btn-sm" id="fullscreenBtn">Fullscreen</button>
          </div>
        </div>
      </div>
      <div class="episodes-area" id="episodesArea" style="display:none">
        <h3>Episodes</h3>
        <div class="ep-scroll" id="epScroll"></div>
      </div>
    </div>

    <aside class="sidebar" id="sidebar">
      <div class="side-card" id="animeInfo"></div>
      <div class="side-card" id="relatedSection" style="display:none">
        <h4>Related</h4>
        <div class="related-slider" id="relatedSlider"></div>
      </div>
    </aside>
  </div>

  <footer class="footer">
    <p class="footer-text">© 2025 NekoStream</p>
  </footer>

  <script>
    (function(){
      'use strict';
      const API_BASE='https://api.jikan.moe/v4';
      const params=new URLSearchParams(location.search);
      const malId=params.get('id');
      let currentEp=parseInt(params.get('ep'))||1;
      let isDub=false;
      let autoNext=true;
      let totalEps=1;
      if(!malId){ location.href='index.html'; return; }

      function getStreamUrl(id,ep,dub){ return `https://megaplay.buzz/stream/mal/${id}/${ep}/${dub?'dub':'sub'}`; }

      // Nav
      const menuBtn=document.getElementById('menuBtn');
      const mobileNav=document.getElementById('mobileNav');
      const navOverlay=document.getElementById('navOverlay');
      menuBtn?.addEventListener('click',()=>{ mobileNav.classList.toggle('open'); navOverlay.classList.toggle('open'); mobileNav.setAttribute('aria-hidden',!mobileNav.classList.contains('open')); });
      navOverlay?.addEventListener('click',()=>{ mobileNav.classList.remove('open'); navOverlay.classList.remove('open'); mobileNav.setAttribute('aria-hidden','true'); });

      function renderPlayer(){
        const url=getStreamUrl(malId,currentEp,isDub);
        document.getElementById('playerWrap').innerHTML=`<iframe src="${url}" allowfullscreen allow="autoplay; fullscreen" title="Anime Player"></iframe>`;
        document.title=`EP ${currentEp} - NekoStream`;
        // Update URL without reload
        history.replaceState(null,'','watch.html?id='+malId+'&ep='+currentEp);
        // Highlight current ep
        document.querySelectorAll('.ep-pill').forEach(el=>el.classList.toggle('current', parseInt(el.dataset.ep)===currentEp));
        // Auto next simulation (since we can't detect iframe end, we rely on user or timer if needed)
      }

      async function loadWatch(){
        const [anime, episodes] = await Promise.allSettled([
          fetch(API_BASE+'/anime/'+malId+'/full').then(r=>r.ok?r.json():null).catch(()=>null),
          fetch(API_BASE+'/anime/'+malId+'/episodes').then(r=>r.ok?r.json():null).catch(()=>null)
        ]);
        const data = anime.status==='fulfilled' && anime.value ? anime.value.data : null;
        const eps = episodes.status==='fulfilled' && episodes.value ? (episodes.value.data||[]) : [];
        totalEps = data?.episodes || eps.length || 1;

        // Sidebar info
        if(data){
          document.getElementById('animeInfo').innerHTML=`
            <img class="side-poster" src="${data.images?.jpg?.image_url||''}" alt="${data.title||''}">
            <div class="side-title">${data.title_english||data.title}</div>
            <div class="side-meta">${data.type||'TV'} • ${data.score?'★ '+data.score:'N/A'} • ${totalEps} EP</div>
            <div class="side-desc">${data.synopsis||''}</div>
          `;
          // Related from relations
          const rels = (data.relations||[]).flatMap(r=>r.entry||[]).slice(0,8);
          if(rels.length){
            document.getElementById('relatedSection').style.display='block';
            document.getElementById('relatedSlider').innerHTML = rels.map(r=>`
              <a href="anime.html?id=${r.mal_id}" class="rel-card">
                <img src="${r.images?.jpg?.image_url||''}" alt="" loading="lazy">
                <div class="rel-title">${r.name}</div>
              </a>
            `).join('');
          }
        }

        // Episodes list
        const epCount = Math.min(totalEps, 50);
        if(epCount>1){
          document.getElementById('episodesArea').style.display='block';
          const scroll = document.getElementById('epScroll');
          scroll.innerHTML = Array.from({length:epCount},(_,i)=>`
            <button class="ep-pill ${i+1===currentEp?'current':''}" data-ep="${i+1}">EP ${i+1}</button>
          `).join('');
          scroll.querySelectorAll('.ep-pill').forEach(btn=>{
            btn.addEventListener('click',()=>{ currentEp=parseInt(btn.dataset.ep); renderPlayer(); });
          });
        }

        renderPlayer();
      }

      // Controls
      document.getElementById('prevEp')?.addEventListener('click',()=>{ if(currentEp>1){ currentEp--; renderPlayer(); } });
      document.getElementById('nextEp')?.addEventListener('click',()=>{ if(currentEp<<totalEps){ currentEp++; renderPlayer(); } });
      document.getElementById('subBtn')?.addEventListener('click',()=>{ isDub=false; document.getElementById('subBtn').classList.add('active'); document.getElementById('dubBtn').classList.remove('active'); renderPlayer(); });
      document.getElementById('dubBtn')?.addEventListener('click',()=>{ isDub=true; document.getElementById('dubBtn').classList.add('active'); document.getElementById('subBtn').classList.remove('active'); renderPlayer(); });
      document.getElementById('autoNext')?.addEventListener('click',function(){ autoNext=!autoNext; this.textContent='Auto: '+(autoNext?'ON':'OFF'); this.classList.toggle('active',autoNext); });
      document.getElementById('theaterBtn')?.addEventListener('click',()=>{ document.body.classList.toggle('theater'); });
      document.getElementById('fullscreenBtn')?.addEventListener('click',()=>{
        const el=document.getElementById('playerWrap');
        if(document.fullscreenElement){ document.exitFullscreen(); }
        else if(el.requestFullscreen){ el.requestFullscreen(); }
        else if(el.webkitRequestFullscreen){ el.webkitRequestFullscreen(); }
      });

      // Keyboard shortcuts
      document.addEventListener('keydown',e=>{
        if(document.activeElement?.tagName==='INPUT')return;
        switch(e.key.toLowerCase()){
          case 'f': document.getElementById('fullscreenBtn').click(); break;
          case 't': document.getElementById('theaterBtn').click(); break;
          case 'n': if(currentEp<<totalEps){currentEp++;renderPlayer();} break;
          case 'p': if(currentEp>1){currentEp--;renderPlayer();} break;
          case 's': document.getElementById('subBtn').click(); break;
          case 'd': document.getElementById('dubBtn').click(); break;
        }
      });

      loadWatch();
    })();
  </script>
</body>
</html>
