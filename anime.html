<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Anime details - watch trailers, see characters, and start streaming.">
    <title>AnimeStream - Anime Details</title>
    <style>
        :root {
            --bg-primary: #0a0a14;
            --accent: #8b2be2;
            --text-primary: #fff;
            --text-secondary: #a0a0c0;
            --card-bg: rgba(20, 20, 35, 0.8);
            --glass-border: rgba(255, 255, 255, 0.08);
            --header-height: 64px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { overflow-x:hidden; max-width:100%; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height:1.5;
            padding-top: var(--header-height);
        }
        a { color:inherit; text-decoration:none; }
        button { cursor:pointer; font-family:inherit; border:none; }
        img { max-width:100%; display:block; }

        /* Header */
        .site-header {
            position:fixed; top:0; left:0; width:100%; height:var(--header-height);
            background:rgba(10,10,20,0.85); backdrop-filter:blur(16px); z-index:100;
            border-bottom:1px solid rgba(255,255,255,0.06);
        }
        .header-inner {
            max-width:1400px; margin:0 auto; padding:0 clamp(12px,3vw,30px);
            height:100%; display:flex; align-items:center; justify-content:space-between;
        }
        .logo {
            display:flex; align-items:center; gap:10px; color:#fff; font-weight:800;
            font-size:clamp(18px,2.5vw,24px);
        }
        .logo-icon-img { width:32px; height:32px; }
        .logo-accent { color:var(--accent); }
        .hamburger-btn {
            display:flex; align-items:center; justify-content:center;
            background:none; color:#fff; padding:8px; border-radius:8px;
        }
        .search-toggle-btn {
            background:none; color:#fff; padding:8px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
        }

        /* Sidebar */
        .mobile-sidebar { position:fixed; inset:0; z-index:200; display:none; }
        .mobile-sidebar.active { display:block; }
        .sidebar-backdrop { position:absolute; inset:0; background:rgba(0,0,0,0.7); }
        .sidebar-panel {
            position:absolute; top:0; left:0; bottom:0; width:min(280px,80vw);
            background:#0d0d20; border-right:1px solid rgba(255,255,255,0.08);
            transform:translateX(-100%); transition:0.3s; padding:20px;
        }
        .mobile-sidebar.active .sidebar-panel { transform:translateX(0); }
        .sidebar-link {
            display:block; padding:12px; border-radius:10px; color:#ccc; margin-bottom:4px;
        }
        .sidebar-link:hover, .sidebar-link.active { background:rgba(138,43,226,0.2); color:#fff; }

        /* Search overlay */
        .search-overlay {
            position:fixed; inset:0; z-index:300; display:none; align-items:flex-start;
            justify-content:center; padding-top:clamp(60px,12vh,100px);
        }
        .search-overlay.active { display:flex; }
        .search-overlay-backdrop { position:absolute; inset:0; background:rgba(5,5,15,0.9); backdrop-filter:blur(10px); }
        .search-overlay-content {
            position:relative; width:min(600px,90vw); background:rgba(18,18,40,0.8);
            border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:20px;
            backdrop-filter:blur(20px);
        }
        .search-input-wrap {
            display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.05);
            border-radius:14px; padding:6px 16px;
        }
        .search-input {
            flex:1; background:transparent; border:none; color:#fff; font-size:18px;
            padding:12px 0; outline:none;
        }
        .search-close-btn { background:none; color:#aaa; font-size:18px; padding:6px; }
        .search-suggestions { margin-top:14px; max-height:60vh; overflow-y:auto; }

        /* Main content */
        .banner-section {
            position:relative; width:100%; height:clamp(300px,40vh,500px); overflow:hidden;
        }
        .banner-bg {
            width:100%; height:100%; object-fit:cover; filter:brightness(0.4);
        }
        .banner-overlay {
            position:absolute; inset:0;
            background:linear-gradient(transparent 50%, var(--bg-primary) 100%);
        }
        .banner-poster {
            position:absolute; bottom:20px; left:clamp(20px,5vw,60px);
            width:clamp(120px,15vw,200px); border-radius:12px; border:2px solid var(--accent);
            box-shadow:0 0 30px rgba(138,43,226,0.4);
        }
        .details-grid {
            max-width:1200px; margin:0 auto; padding:clamp(16px,4vw,40px);
            display:grid; grid-template-columns:1fr; gap:30px;
        }
        .detail-block {
            background:var(--card-bg); border:1px solid var(--glass-border);
            border-radius:16px; padding:20px; backdrop-filter:blur(8px);
        }
        .detail-title { font-size:clamp(22px,3vw,28px); font-weight:700; margin-bottom:12px; }
        .detail-meta { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:12px; }
        .meta-badge {
            padding:4px 12px; border-radius:16px; font-size:13px;
            background:rgba(138,43,226,0.2); color:#e0c4ff;
        }
        .synopsis { color:#ccc; line-height:1.7; font-size:15px; }
        .btn-group { display:flex; flex-wrap:wrap; gap:12px; margin-top:20px; }
        .btn {
            display:inline-flex; align-items:center; gap:8px; padding:12px 24px;
            border-radius:30px; font-weight:700; font-size:14px; transition:0.3s;
        }
        .btn.primary { background:var(--accent); color:#fff; }
        .btn.secondary { background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(255,255,255,0.2); }
        .btn:hover { transform:translateY(-2px); }

        /* Sliders (relations, recs, chars) */
        .slider-wrapper { position:relative; overflow:hidden; margin:20px 0; }
        .slider-track {
            display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory;
            padding-bottom:8px; scrollbar-width:none;
        }
        .slider-track::-webkit-scrollbar { display:none; }
        .anime-card {
            flex:0 0 auto; width:clamp(120px,14vw,160px); border-radius:12px;
            background:var(--card-bg); border:1px solid var(--glass-border);
            overflow:hidden; transition:0.3s; text-align:center;
        }
        .anime-card:hover { transform:translateY(-4px); }
        .anime-card img { aspect-ratio:2/3; object-fit:cover; }
        .anime-card .card-title { font-size:12px; padding:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

        /* Footer */
        .site-footer {
            background:rgba(10,10,20,0.95); border-top:1px solid rgba(255,255,255,0.05);
            padding:30px; text-align:center; margin-top:40px;
        }
        .footer-copy { color:#666; font-size:12px; }

        @media (max-width:768px) {
            .details-grid { padding:12px; }
            .btn { padding:10px 18px; font-size:13px; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
                <svg width="22" height="18"><rect width="22" height="2.5" rx="1.25" fill="currentColor"/><rect y="7.5" width="22" height="2.5" rx="1.25" fill="currentColor"/><rect y="15" width="22" height="2.5" rx="1.25" fill="currentColor"/></svg>
            </button>
            <a href="index.html" class="logo">
                <img class="logo-icon-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%238b2be2'/%3E%3Cpolygon points='12,8 24,16 12,24' fill='white'/%3E%3C/svg%3E" alt="logo">
                Anime<span class="logo-accent">Stream</span>
            </a>
            <button class="search-toggle-btn" id="searchToggleBtn"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2.5" fill="none"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2.5"/></svg></button>
        </div>
    </header>

    <aside class="mobile-sidebar" id="mobileSidebar">
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
        <div class="sidebar-panel">
            <div style="display:flex;justify-content:space-between;margin-bottom:24px;">
                <span style="font-weight:700;">AnimeStream</span>
                <button id="sidebarClose" style="background:none;color:#fff;font-size:20px;">✕</button>
            </div>
            <a href="index.html" class="sidebar-link">🏠 Home</a>
            <a href="search.html" class="sidebar-link">🔍 Browse</a>
            <a href="schedule.html" class="sidebar-link">📅 Schedule</a>
            <a href="creator.html" class="sidebar-link">👤 Creator</a>
        </div>
    </aside>

    <div class="search-overlay" id="searchOverlay">
        <div class="search-overlay-backdrop" id="searchBackdrop"></div>
        <div class="search-overlay-content">
            <div class="search-input-wrap">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8b2be2" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="search-input" id="searchInput" placeholder="Search anime..." autocomplete="off">
                <button class="search-close-btn" id="searchCloseBtn">✕</button>
            </div>
            <div class="search-suggestions" id="searchSuggestions"></div>
        </div>
    </div>

    <main id="mainContent">
        <div id="loading" style="text-align:center;padding:80px;color:#aaa;">Loading...</div>
    </main>

    <footer class="site-footer">
        <div class="footer-copy">© 2025 AnimeStream</div>
    </footer>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const animeId = params.get('id');
            if (!animeId) { document.getElementById('loading').textContent = 'No anime ID provided.'; return; }

            const API = 'https://api.jikan.moe/v4';
            const CACHE = 'anime_detail_';

            function getCache(k) {
                try {
                    const i = localStorage.getItem(CACHE+k);
                    if (!i) return null;
                    const p = JSON.parse(i);
                    if (Date.now()-p.t > 15*60*1000) { localStorage.removeItem(CACHE+k); return null; }
                    return p.d;
                } catch(e) { return null; }
            }
            function setCache(k, data) {
                try { localStorage.setItem(CACHE+k, JSON.stringify({d:data, t:Date.now()})); } catch(e) {}
            }

            async function fetchAPI(url, cacheKey) {
                if (cacheKey) { const c = getCache(cacheKey); if (c) return c; }
                const res = await fetch(url);
                if (!res.ok) throw new Error('API error');
                const data = await res.json();
                if (cacheKey && data.data) setCache(cacheKey, data);
                return data;
            }

            function buildPage(anime, characters, relations) {
                const main = document.getElementById('mainContent');
                const img = anime.images?.webp?.large_image_url || anime.images?.jpg?.large_image_url || '';
                const title = anime.title_english || anime.title;
                const synopsis = anime.synopsis || 'No synopsis available.';
                const genres = (anime.genres||[]).map(g=>g.name).join(', ');
                const studios = (anime.studios||[]).map(s=>s.name).join(', ');
                const trailer = anime.trailer?.embed_url || '';

                main.innerHTML = `
                    <div class="banner-section">
                        <img class="banner-bg" src="${img}" alt="">
                        <div class="banner-overlay"></div>
                        <img class="banner-poster" src="${anime.images?.webp?.image_url || anime.images?.jpg?.image_url}" alt="">
                    </div>
                    <div class="details-grid">
                        <div class="detail-block">
                            <h1 class="detail-title">${title}</h1>
                            <div class="detail-meta">
                                <span class="meta-badge">⭐ ${anime.score||'N/A'}</span>
                                <span class="meta-badge">${anime.type||'TV'}</span>
                                <span class="meta-badge">${anime.episodes||'?'} eps</span>
                                <span class="meta-badge">${anime.status||'Unknown'}</span>
                            </div>
                            <p class="synopsis">${synopsis}</p>
                            <div class="detail-meta" style="margin-top:12px;">
                                ${genres ? `<span class="meta-badge">${genres}</span>` : ''}
                                ${studios ? `<span class="meta-badge">${studios}</span>` : ''}
                            </div>
                            <div class="btn-group">
                                <a href="watch.html?id=${anime.mal_id}&ep=1" class="btn primary">▶ Watch Now</a>
                                ${trailer ? `<a href="${trailer}" target="_blank" class="btn secondary">🎬 Trailer</a>` : ''}
                            </div>
                        </div>
                        ${characters && characters.length ? `
                        <div class="detail-block">
                            <h3 style="margin-bottom:12px;">Characters</h3>
                            <div class="slider-wrapper">
                                <div class="slider-track" id="charSlider">
                                    ${characters.slice(0,15).map(c => `
                                        <div class="anime-card">
                                            <img src="${c.character.images?.webp?.image_url || c.character.images?.jpg?.image_url}" alt="${c.character.name}">
                                            <div class="card-title">${c.character.name}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>` : ''}
                        ${relations && relations.length ? `
                        <div class="detail-block">
                            <h3 style="margin-bottom:12px;">Related Anime</h3>
                            <div class="slider-wrapper">
                                <div class="slider-track" id="relSlider">
                                    ${relations.map(r => r.entry?.[0] ? `
                                        <a href="anime.html?id=${r.entry[0].mal_id}" class="anime-card">
                                            <img src="${r.entry[0].images?.webp?.image_url || r.entry[0].images?.jpg?.image_url}" alt="${r.entry[0].name}">
                                            <div class="card-title">${r.entry[0].name}</div>
                                        </a>
                                    ` : '').join('')}
                                </div>
                            </div>
                        </div>` : ''}
                    </div>
                `;
            }

            (async () => {
                try {
                    const animeData = await fetchAPI(`${API}/anime/${animeId}/full`, `anime_${animeId}`);
                    const charsData = await fetchAPI(`${API}/anime/${animeId}/characters`, `char_${animeId}`);
                    const relationsData = await fetchAPI(`${API}/anime/${animeId}/relations`, `rel_${animeId}`);
                    buildPage(animeData.data, charsData?.data || [], relationsData?.data || []);
                } catch(e) {
                    document.getElementById('loading').innerHTML = '<div style="color:red;">Failed to load. <button onclick="location.reload()">Retry</button></div>';
                }
            })();

            // UI interactions (sidebar, search) similar to homepage
            document.getElementById('hamburgerBtn')?.addEventListener('click', ()=> document.getElementById('mobileSidebar').classList.add('active'));
            document.getElementById('sidebarBackdrop')?.addEventListener('click', ()=> document.getElementById('mobileSidebar').classList.remove('active'));
            document.getElementById('sidebarClose')?.addEventListener('click', ()=> document.getElementById('mobileSidebar').classList.remove('active'));
            // Search overlay
            const searchToggle = document.getElementById('searchToggleBtn');
            const searchOverlay = document.getElementById('searchOverlay');
            searchToggle?.addEventListener('click', ()=> searchOverlay.classList.add('active'));
            document.getElementById('searchBackdrop')?.addEventListener('click', ()=> searchOverlay.classList.remove('active'));
            document.getElementById('searchCloseBtn')?.addEventListener('click', ()=> searchOverlay.classList.remove('active'));
            let debounce;
            document.getElementById('searchInput')?.addEventListener('input', function(e) {
                clearTimeout(debounce);
                const q = e.target.value.trim();
                if (q.length<2) { document.getElementById('searchSuggestions').innerHTML=''; return; }
                debounce = setTimeout(async ()=>{
                    try {
                        const res = await fetch(`${API}/anime?q=${encodeURIComponent(q)}&limit=5&sfw=true`);
                        const d = await res.json();
                        const html = d.data?.map(a=>`<a href="anime.html?id=${a.mal_id}" style="display:flex;gap:10px;padding:8px;border-radius:8px;color:#ddd;">${a.title}</a>`).join('') || 'No results';
                        document.getElementById('searchSuggestions').innerHTML = html;
                    } catch(e) {}
                }, 300);
            });
        })();
    </script>
</body>
</html>
