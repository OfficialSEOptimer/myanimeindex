<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Anime details – synopsis, characters, trailers, and start watching.">
    <title>AnimeStream - Anime Details</title>
    <style>
        :root {
            --bg-primary: #0a0a14;
            --bg-secondary: #12122a;
            --accent: #8b2be2;
            --accent-glow: rgba(138, 43, 226, 0.5);
            --text-primary: #fff;
            --text-secondary: #a0a0c0;
            --card-bg: rgba(20, 20, 35, 0.8);
            --glass-border: rgba(255, 255, 255, 0.08);
            --header-height: 64px;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { overflow-x:hidden; max-width:100%; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            padding-top: var(--header-height);
            -webkit-font-smoothing: antialiased;
        }
        a { color:inherit; text-decoration:none; }
        button { cursor:pointer; font-family:inherit; border:none; background:none; }
        img { max-width:100%; display:block; }

        /* Header */
        .site-header {
            position:fixed; top:0; left:0; width:100%; height:var(--header-height);
            background:rgba(10,10,20,0.85); backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px); z-index:100;
            border-bottom:1px solid rgba(255,255,255,0.06);
        }
        .header-inner {
            max-width:1400px; margin:0 auto; padding:0 clamp(12px,3vw,30px);
            height:100%; display:flex; align-items:center; justify-content:space-between;
        }
        .logo { display:flex; align-items:center; gap:10px; color:#fff; font-weight:800; font-size:clamp(18px,2.5vw,24px); letter-spacing:-0.5px; }
        .logo-icon-img { width:32px; height:32px; }
        .logo-accent { color:var(--accent); }
        .hamburger-btn { display:flex; align-items:center; justify-content:center; padding:8px; border-radius:8px; color:#fff; }
        .hamburger-btn:hover { background:rgba(255,255,255,0.1); }
        .search-toggle-btn { padding:8px; border-radius:50%; display:flex; color:#fff; }
        .search-toggle-btn:hover { background:rgba(255,255,255,0.1); }

        /* Sidebar */
        .mobile-sidebar { position:fixed; inset:0; z-index:200; display:none; }
        .mobile-sidebar.active { display:block; }
        .sidebar-backdrop { position:absolute; inset:0; background:rgba(0,0,0,0.7); }
        .sidebar-panel {
            position:absolute; top:0; left:0; bottom:0; width:min(280px,80vw);
            background:#0d0d20; border-right:1px solid rgba(255,255,255,0.08);
            transform:translateX(-100%); transition:0.3s cubic-bezier(0.4,0,0.2,1);
            padding:20px; display:flex; flex-direction:column;
        }
        .mobile-sidebar.active .sidebar-panel { transform:translateX(0); }
        .sidebar-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
        .sidebar-logo { font-weight:700; font-size:18px; }
        .sidebar-close { font-size:20px; color:#fff; }
        .sidebar-nav { display:flex; flex-direction:column; gap:6px; }
        .sidebar-link { padding:12px 14px; border-radius:10px; font-size:15px; color:#ccc; transition:0.2s; }
        .sidebar-link:hover, .sidebar-link.active { background:rgba(138,43,226,0.2); color:#fff; }

        /* Search overlay */
        .search-overlay {
            position:fixed; inset:0; z-index:300; display:none; align-items:flex-start;
            justify-content:center; padding-top:clamp(60px,12vh,100px);
        }
        .search-overlay.active { display:flex; }
        .search-overlay-backdrop { position:absolute; inset:0; background:rgba(5,5,15,0.9); backdrop-filter:blur(10px); }
        .search-overlay-content {
            position:relative; width:min(600px,90vw); max-width:100%; z-index:1;
            background:rgba(18,18,40,0.8); border:1px solid rgba(255,255,255,0.1);
            border-radius:20px; padding:20px; backdrop-filter:blur(20px);
            box-shadow:0 25px 50px rgba(0,0,0,0.6);
            animation:searchFadeIn 0.25s ease;
            overflow:hidden;
        }
        @keyframes searchFadeIn { from {opacity:0; transform:translateY(-15px);} to {opacity:1; transform:translateY(0);} }
        .search-input-wrap { display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.05); border-radius:14px; padding:6px 16px; border:1px solid rgba(255,255,255,0.1); }
        .search-input-icon { flex-shrink:0; }
        .search-input { flex:1; background:transparent; border:none; color:#fff; font-size:clamp(16px,3vw,18px); padding:12px 0; outline:none; min-width:0; }
        .search-input::placeholder { color:#777; }
        .search-close-btn { color:#aaa; font-size:18px; padding:6px; }
        .search-suggestions { margin-top:14px; max-height:60vh; overflow-y:auto; overflow-x:hidden; max-width:100%; }
        .search-suggestion-item { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; transition:0.2s; color:#ddd; text-decoration:none; }
        .search-suggestion-item:hover { background:rgba(138,43,226,0.2); }
        .suggestion-img { width:42px; height:58px; object-fit:cover; border-radius:6px; background:#1a1a2e; flex-shrink:0; }
        .suggestion-info { display:flex; flex-direction:column; overflow:hidden; }
        .suggestion-title { font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .suggestion-meta { font-size:12px; color:#999; }
        .search-no-results { text-align:center; color:#999; padding:20px; font-size:14px; }

        /* Cinematic Banner */
        .banner-section {
            position:relative; width:100%; height:clamp(360px, 45vh, 520px); overflow:hidden;
            background:#0a0a0a;
        }
        .banner-bg {
            width:100%; height:100%; object-fit:cover; filter:brightness(0.45);
        }
        .banner-gradient {
            position:absolute; inset:0;
            background: linear-gradient(180deg, transparent 30%, rgba(10,10,20,0.9) 90%, var(--bg-primary) 100%);
            z-index:2;
        }
        .banner-poster-wrap {
            position:absolute; bottom:clamp(20px,4%,40px); left:clamp(20px,5vw,60px);
            z-index:3; display:flex; align-items:flex-end; gap:20px;
        }
        .banner-poster {
            width:clamp(120px,15vw,200px); border-radius:16px; border:2px solid rgba(138,43,226,0.6);
            box-shadow:0 12px 40px rgba(138,43,226,0.3); transition:0.3s;
        }
        .banner-title-block {
            padding-bottom:10px;
        }
        .banner-title {
            font-size:clamp(24px, 4vw, 44px); font-weight:800; line-height:1.1;
            text-shadow:0 2px 20px rgba(0,0,0,0.7); margin-bottom:8px;
        }
        .banner-meta {
            display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px;
        }
        .banner-meta .badge {
            padding:4px 14px; border-radius:20px; font-size:13px; font-weight:600;
            backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
            background:rgba(138,43,226,0.25); border:1px solid rgba(138,43,226,0.4); color:#e0c4ff;
            white-space:nowrap;
        }
        .badge.score { background:rgba(255,193,7,0.2); border-color:rgba(255,193,7,0.4); color:#ffd54f; }
        .btn-group { display:flex; flex-wrap:wrap; gap:12px; margin-top:6px; }
        .btn {
            display:inline-flex; align-items:center; gap:8px; padding:12px 24px;
            border-radius:30px; font-weight:700; font-size:14px; transition:0.3s ease;
            text-decoration:none; white-space:nowrap;
        }
        .btn.primary { background:var(--accent); color:#fff; box-shadow:0 4px 20px rgba(138,43,226,0.4); }
        .btn.primary:hover { background:#9b4de8; box-shadow:0 6px 24px rgba(138,43,226,0.6); transform:translateY(-2px); }
        .btn.outline { background:rgba(255,255,255,0.08); color:#fff; border:1.5px solid rgba(255,255,255,0.3); backdrop-filter:blur(8px); }
        .btn.outline:hover { background:rgba(255,255,255,0.16); border-color:rgba(255,255,255,0.5); transform:translateY(-2px); }

        /* Details grid */
        .details-grid {
            max-width:1200px; margin:0 auto; padding:clamp(16px,4vw,40px);
            display:grid; grid-template-columns:1fr; gap:24px;
        }
        .detail-block {
            background:var(--card-bg); border:1px solid var(--glass-border);
            border-radius:20px; padding:clamp(16px,3vw,28px);
            backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
        }
        .synopsis {
            color:#ccc; line-height:1.7; font-size:clamp(14px,1.5vw,16px);
            margin:16px 0;
        }
        .detail-stats {
            display:flex; flex-wrap:wrap; gap:16px; margin-top:16px;
            align-items:center;
        }
        .stat-item {
            background:rgba(255,255,255,0.03); border-radius:12px; padding:10px 16px;
            border:1px solid rgba(255,255,255,0.05);
        }
        .stat-label { font-size:11px; color:#aaa; text-transform:uppercase; letter-spacing:0.5px; }
        .stat-value { font-size:16px; font-weight:700; }

        /* Sliders for characters / relations */
        .slider-section { margin-top:24px; }
        .slider-header {
            display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
        }
        .slider-title { font-size:20px; font-weight:700; }
        .slider-wrapper { position:relative; overflow:hidden; }
        .slider-track {
            display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory;
            -webkit-overflow-scrolling:touch; padding:6px 2px 12px; cursor:grab;
            scrollbar-width:none; user-select:none;
        }
        .slider-track::-webkit-scrollbar { display:none; }
        .slider-track.dragging { cursor:grabbing; scroll-snap-type:none; }
        .anime-card {
            flex:0 0 auto; width:clamp(140px, 16vw, 180px); scroll-snap-align:start;
            border-radius:14px; overflow:hidden; background:var(--card-bg);
            border:1px solid var(--glass-border); transition:0.35s;
            text-decoration:none; display:block;
        }
        .anime-card:hover { transform:translateY(-5px); box-shadow:0 14px 32px rgba(138,43,226,0.3); border-color:rgba(138,43,226,0.4); }
        .card-img-wrap { position:relative; width:100%; aspect-ratio:2/3; overflow:hidden; background:#1a1a2e; }
        .card-img-wrap img { width:100%; height:100%; object-fit:cover; transition:0.5s; }
        .anime-card:hover .card-img-wrap img { transform:scale(1.06); }
        .card-info { padding:10px 10px 12px; }
        .card-title { font-size:13px; font-weight:600; color:#e8e8f0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

        /* Skeleton loading */
        .skeleton {
            background:linear-gradient(90deg, #1a1a2e 25%, #252540 50%, #1a1a2e 75%);
            background-size:200% 100%; animation:shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% {background-position:-200% 0;} 100% {background-position:200% 0;} }
        .skeleton-banner { height:clamp(360px,45vh,520px); }
        .skeleton-block { height:200px; border-radius:20px; margin-bottom:24px; }

        /* Footer */
        .site-footer {
            background:rgba(10,10,20,0.95); border-top:1px solid rgba(255,255,255,0.05);
            padding:30px; text-align:center; margin-top:40px; color:#666;
        }

        @media (max-width: 768px) {
            .banner-poster-wrap { flex-direction:column; align-items:flex-start; gap:10px; }
            .banner-title { font-size:22px; }
            .btn { padding:10px 18px; font-size:13px; }
            .anime-card { width:clamp(120px,32vw,150px); }
        }
        @media (max-width: 480px) {
            .banner-poster { width:100px; }
            .banner-title { font-size:18px; }
            .detail-block { padding:14px; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <div class="header-inner">
            <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
                <svg width="22" height="18"><rect width="22" height="2.5" rx="1.25" fill="currentColor"/><rect y="7.5" width="22" height="2.5" rx="1.25" fill="currentColor"/><rect y="15" width="22" height="2.5" rx="1.25" fill="currentColor"/></svg>
            </button>
            <a href="index.html" class="logo">
                <img class="logo-icon-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%238b2be2'/%3E%3Cpolygon points='12,8 24,16 12,24' fill='white'/%3E%3C/svg%3E" alt="">
                Anime<span class="logo-accent">Stream</span>
            </a>
            <button class="search-toggle-btn" id="searchToggleBtn" aria-label="Search">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="mobile-sidebar" id="mobileSidebar">
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
        <div class="sidebar-panel">
            <div class="sidebar-header">
                <span class="sidebar-logo">AnimeStream</span>
                <button class="sidebar-close" id="sidebarClose">✕</button>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="sidebar-link">🏠 Home</a>
                <a href="search.html" class="sidebar-link">🔍 Browse</a>
                <a href="schedule.html" class="sidebar-link">📅 Schedule</a>
                <a href="creator.html" class="sidebar-link">👤 Creator</a>
            </nav>
        </div>
    </aside>

    <!-- Search overlay -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-overlay-backdrop" id="searchBackdrop"></div>
        <div class="search-overlay-content">
            <div class="search-input-wrap">
                <svg class="search-input-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8b2be2" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="search-input" id="searchInput" placeholder="Search anime..." autocomplete="off">
                <button class="search-close-btn" id="searchCloseBtn">✕</button>
            </div>
            <div class="search-suggestions" id="searchSuggestions"></div>
        </div>
    </div>

    <!-- Main Content -->
    <main id="mainContent">
        <!-- Skeleton loading -->
        <div id="skeletonLoader">
            <div class="skeleton skeleton-banner"></div>
            <div class="details-grid">
                <div class="skeleton skeleton-block"></div>
                <div class="skeleton skeleton-block" style="height:160px;"></div>
            </div>
        </div>
    </main>

    <footer class="site-footer">© 2025 AnimeStream</footer>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const animeId = params.get('id');
            if (!animeId) {
                document.getElementById('mainContent').innerHTML = '<div style="text-align:center;padding:80px;color:#ff6b6b;">No anime ID provided.</div>';
                return;
            }

            const API = 'https://api.jikan.moe/v4';
            const CACHE_PREFIX = 'anime_detail_';

            function getCache(key) {
                try {
                    const entry = localStorage.getItem(CACHE_PREFIX + key);
                    if (!entry) return null;
                    const parsed = JSON.parse(entry);
                    if (Date.now() - parsed.t > 15 * 60 * 1000) { localStorage.removeItem(CACHE_PREFIX + key); return null; }
                    return parsed.d;
                } catch (e) { return null; }
            }
            function setCache(key, data) {
                try { localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ d: data, t: Date.now() })); } catch (e) {}
            }

            async function fetchWithRetry(url, retries = 2, timeout = 12000) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeout);
                for (let i = 0; i <= retries; i++) {
                    try {
                        const res = await fetch(url, { signal: controller.signal });
                        clearTimeout(timer);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        return await res.json();
                    } catch (err) {
                        clearTimeout(timer);
                        if (i === retries) throw err;
                        await new Promise(r => setTimeout(r, 1000 * (i + 1)));
                    }
                }
            }

            async function fetchAPI(endpoint, cacheKey) {
                if (cacheKey) {
                    const cached = getCache(cacheKey);
                    if (cached) return cached;
                }
                const data = await fetchWithRetry(`${API}${endpoint}`);
                if (cacheKey && data && data.data) setCache(cacheKey, data);
                return data;
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str || '';
                return div.innerHTML;
            }

            function buildPage(anime, characters, relations) {
                const main = document.getElementById('mainContent');
                document.getElementById('skeletonLoader')?.remove();

                const bannerImg = anime.images?.webp?.large_image_url || anime.images?.jpg?.large_image_url || '';
                const posterImg = anime.images?.webp?.image_url || anime.images?.jpg?.image_url || '';
                const title = anime.title_english || anime.title || 'Unknown';
                const synopsis = anime.synopsis || 'No synopsis available.';
                const score = anime.score || 'N/A';
                const episodes = anime.episodes || '?';
                const type = anime.type || 'TV';
                const status = anime.status || 'Unknown';
                const studios = (anime.studios || []).map(s => s.name).join(', ');
                const genres = (anime.genres || []).map(g => g.name).join(' · ');
                const trailer = anime.trailer?.embed_url;

                main.innerHTML = `
                    <div class="banner-section">
                        <img class="banner-bg" src="${bannerImg}" alt="" onerror="this.style.display='none'">
                        <div class="banner-gradient"></div>
                        <div class="banner-poster-wrap">
                            <img class="banner-poster" src="${posterImg}" alt="${escapeHTML(title)}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22300%22><rect fill=%22%231a1a2e%22 width=%22200%22 height=%22300%22/></svg>'">
                            <div class="banner-title-block">
                                <h1 class="banner-title">${escapeHTML(title)}</h1>
                                <div class="banner-meta">
                                    <span class="badge score">⭐ ${score}</span>
                                    <span class="badge">${type}</span>
                                    <span class="badge">${episodes} eps</span>
                                    <span class="badge">${status}</span>
                                </div>
                                <div class="btn-group">
                                    <a href="watch.html?id=${anime.mal_id}&ep=1" class="btn primary">▶ Watch Now</a>
                                    ${trailer ? `<a href="${trailer}" target="_blank" class="btn outline">🎬 Trailer</a>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="details-grid">
                        <div class="detail-block">
                            <div class="synopsis">${escapeHTML(synopsis)}</div>
                            <div class="detail-stats">
                                ${genres ? `<div class="stat-item"><div class="stat-label">Genres</div><div class="stat-value" style="font-size:14px;">${escapeHTML(genres)}</div></div>` : ''}
                                ${studios ? `<div class="stat-item"><div class="stat-label">Studio</div><div class="stat-value">${escapeHTML(studios)}</div></div>` : ''}
                                <div class="stat-item"><div class="stat-label">Rating</div><div class="stat-value">${score}</div></div>
                            </div>
                        </div>
                        ${characters && characters.length > 0 ? `
                        <div class="detail-block">
                            <div class="slider-header"><h2 class="slider-title">Characters</h2></div>
                            <div class="slider-wrapper">
                                <div class="slider-track" id="charSlider">
                                    ${characters.slice(0,18).map(c => `
                                        <a href="#" class="anime-card" onclick="return false;">
                                            <div class="card-img-wrap">
                                                <img src="${c.character.images?.webp?.image_url || c.character.images?.jpg?.image_url}" alt="${escapeHTML(c.character.name)}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22180%22 height=%22270%22><rect fill=%22%231a1a2e%22 width=%22180%22 height=%22270%22/></svg>'">
                                            </div>
                                            <div class="card-info"><div class="card-title">${escapeHTML(c.character.name)}</div></div>
                                        </a>
                                    `).join('')}
                                </div>
                            </div>
                        </div>` : ''}
                        ${relations && relations.length > 0 ? `
                        <div class="detail-block">
                            <div class="slider-header"><h2 class="slider-title">Related Anime</h2></div>
                            <div class="slider-wrapper">
                                <div class="slider-track" id="relSlider">
                                    ${relations.map(r => r.entry?.[0] ? `
                                        <a href="anime.html?id=${r.entry[0].mal_id}" class="anime-card">
                                            <div class="card-img-wrap">
                                                <img src="${r.entry[0].images?.webp?.image_url || r.entry[0].images?.jpg?.image_url}" alt="${escapeHTML(r.entry[0].name)}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22180%22 height=%22270%22><rect fill=%22%231a1a2e%22 width=%22180%22 height=%22270%22/></svg>'">
                                            </div>
                                            <div class="card-info"><div class="card-title">${escapeHTML(r.entry[0].name)}</div></div>
                                        </a>
                                    ` : '').join('')}
                                </div>
                            </div>
                        </div>` : ''}
                    </div>
                `;
            }

            function showError(msg) {
                document.getElementById('mainContent').innerHTML = `
                    <div style="text-align:center;padding:80px 20px;">
                        <p style="color:#ff6b6b;font-size:18px;margin-bottom:20px;">${msg}</p>
                        <button onclick="location.reload()" class="btn primary">Retry</button>
                    </div>`;
            }

            (async () => {
                try {
                    const [animeData, charsData, relsData] = await Promise.allSettled([
                        fetchAPI(`/anime/${animeId}/full`, `anime_${animeId}`),
                        fetchAPI(`/anime/${animeId}/characters`, `char_${animeId}`),
                        fetchAPI(`/anime/${animeId}/relations`, `rel_${animeId}`)
                    ]);
                    if (animeData.status === 'rejected' || !animeData.value?.data) throw new Error('Could not load anime');
                    buildPage(
                        animeData.value.data,
                        charsData.status === 'fulfilled' ? charsData.value?.data : [],
                        relsData.status === 'fulfilled' ? relsData.value?.data : []
                    );
                } catch (e) {
                    showError('Failed to load anime details. Please try again.');
                }
            })();

            // ---------- UI Interactions ----------
            document.getElementById('hamburgerBtn').addEventListener('click', () => document.getElementById('mobileSidebar').classList.add('active'));
            document.getElementById('sidebarBackdrop').addEventListener('click', () => document.getElementById('mobileSidebar').classList.remove('active'));
            document.getElementById('sidebarClose').addEventListener('click', () => document.getElementById('mobileSidebar').classList.remove('active'));

            const searchToggle = document.getElementById('searchToggleBtn');
            const searchOverlay = document.getElementById('searchOverlay');
            const searchBackdrop = document.getElementById('searchBackdrop');
            const searchClose = document.getElementById('searchCloseBtn');
            const searchInput = document.getElementById('searchInput');
            const searchSuggestions = document.getElementById('searchSuggestions');
            let searchTimer;

            searchToggle.addEventListener('click', () => { searchOverlay.classList.add('active'); setTimeout(() => searchInput.focus(), 150); });
            searchBackdrop.addEventListener('click', () => searchOverlay.classList.remove('active'));
            searchClose.addEventListener('click', () => searchOverlay.classList.remove('active'));
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && searchOverlay.classList.contains('active')) searchOverlay.classList.remove('active'); });

            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimer);
                const q = e.target.value.trim();
                if (q.length < 2) { searchSuggestions.innerHTML = ''; return; }
                searchTimer = setTimeout(async () => {
                    try {
                        const data = await fetchAPI(`/anime?q=${encodeURIComponent(q)}&limit=6&sfw=true`);
                        if (data?.data?.length) {
                            searchSuggestions.innerHTML = data.data.map(a => `
                                <a href="anime.html?id=${a.mal_id}" class="search-suggestion-item">
                                    <img src="${a.images?.webp?.small_image_url || a.images?.jpg?.small_image_url || ''}" class="suggestion-img" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2250%22 height=%2270%22><rect fill=%22%231a1a2e%22 width=%2250%22 height=%2270%22/></svg>'">
                                    <div class="suggestion-info">
                                        <span class="suggestion-title">${escapeHTML(a.title)}</span>
                                        <span class="suggestion-meta">${a.type||'TV'} · ${a.score||'?'} ⭐</span>
                                    </div>
                                </a>
                            `).join('');
                        } else {
                            searchSuggestions.innerHTML = '<div class="search-no-results">No results found</div>';
                        }
                    } catch (err) {
                        searchSuggestions.innerHTML = '<div class="search-no-results">Search unavailable</div>';
                    }
                }, 350);
            });
        })();
    </script>
</body>
</html>
