<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Anime details, episodes, characters, and trailers.">
<title>Anime Details - AnimeFlix</title>
<style>
/* ==================== BASE (same variables & reset) ==================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-x: hidden; max-width: 100%; min-height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #0a0a0f; color: #f1f1f1; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; background: none; border: none; }
img { max-width: 100%; height: auto; display: block; }
ul { list-style: none; }
:root {
  --bg: #0a0a0f; --surface: #12121a; --surface-2: #1a1a25;
  --primary: #8b5cf6; --primary-glow: rgba(139,92,246,0.35); --accent: #c084fc;
  --text: #f1f1f1; --text-2: #a1a1aa; --text-3: #71717a;
  --glass: rgba(18,18,26,0.75); --glass-border: rgba(255,255,255,0.08);
  --radius: 12px; --radius-sm: 8px; --radius-lg: 16px;
  --header-height: 64px; --gap: 16px; --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
}

/* ==================== HEADER ==================== */
.header {
  position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); z-index: 900;
  background: rgba(10,10,15,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between;
  padding: 0 clamp(0.75rem, 2vw, 2rem); max-width: 100vw;
}
.header-left, .header-right { display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; min-width: 0; }
.header-center { position: absolute; left: 50%; transform: translateX(-50%); font-size: clamp(1.1rem, 2vw, 1.5rem); font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; color: var(--text); pointer-events: none; }
.logo-accent { color: var(--primary); text-shadow: 0 0 12px var(--primary-glow); }
.icon-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--text); border-radius: var(--radius-sm); transition: background var(--transition), color var(--transition); -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
.icon-btn:hover { background: var(--surface-2); color: var(--primary); }
@media (max-width: 480px) { .icon-btn { width: 36px; height: 36px; } .header-center { font-size: 1rem; letter-spacing: 0.08em; } }

/* ==================== SIDEBAR ==================== */
.sidebar-overlay { position: fixed; inset: 0; z-index: 1099; background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none; transition: opacity var(--transition); }
.sidebar-overlay.active { opacity: 1; pointer-events: auto; }
.sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: min(300px, 85vw); background: var(--surface); z-index: 1100; transform: translateX(-100%); transition: transform var(--transition); border-right: 1px solid var(--glass-border); padding: 1.5rem; overflow-y: auto; }
.sidebar.active { transform: translateX(0); }
.sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
.sidebar-title { font-size: 1.25rem; font-weight: 700; }
.sidebar-nav a { display: block; padding: 0.875rem 1rem; border-radius: var(--radius-sm); color: var(--text-2); font-weight: 500; transition: background var(--transition), color var(--transition); margin-bottom: 0.25rem; }
.sidebar-nav a:hover, .sidebar-nav a.active { background: rgba(139,92,246,0.15); color: var(--primary); }

/* ==================== SEARCH OVERLAY ==================== */
.search-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(10,10,15,0.97); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: calc(var(--header-height) + 1rem) clamp(1rem, 3vw, 3rem) 2rem; max-width: 100vw; overflow-x: hidden; }
.search-overlay.active { opacity: 1; pointer-events: auto; }
.search-top { width: 100%; max-width: 900px; margin: 0 auto 1.5rem; display: flex; align-items: center; gap: 0.75rem; }
.search-input-wrap { flex: 1; position: relative; min-width: 0; }
.search-input-wrap svg { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.search-input { width: 100%; padding: 0.875rem 1rem 0.875rem 2.75rem; font-size: clamp(1rem, 2vw, 1.25rem); background: var(--surface); border: 2px solid var(--glass-border); border-radius: var(--radius-lg); color: var(--text); outline: none; transition: border-color var(--transition), box-shadow var(--transition); }
.search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }
.search-close-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--surface-2); border: none; color: var(--text); border-radius: 50%; flex-shrink: 0; transition: background var(--transition); }
.search-close-btn:hover { background: var(--primary); color: white; }
.search-results { flex: 1; overflow-y: auto; overflow-x: hidden; width: 100%; max-width: 900px; margin: 0 auto; -webkit-overflow-scrolling: touch; }
.search-loading, .search-empty { text-align: center; color: var(--text-3); padding: 3rem 1rem; font-size: 1rem; }
.search-result-item { display: flex; align-items: center; gap: 1rem; padding: 0.75rem; border-radius: var(--radius); background: var(--surface); margin-bottom: 0.5rem; border: 1px solid var(--glass-border); transition: background var(--transition), border-color var(--transition); max-width: 100%; }
.search-result-item:hover { background: var(--surface-2); border-color: var(--primary); }
.search-result-item img { width: 56px; height: 80px; object-fit: cover; border-radius: var(--radius-sm); flex-shrink: 0; background: var(--surface-2); }
.search-result-info { min-width: 0; flex: 1; }
.search-result-title { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: clamp(0.875rem, 1.5vw, 1rem); }
.search-result-meta { font-size: 0.8rem; color: var(--text-3); margin-top: 0.25rem; }

/* ==================== ANIME DETAILS ==================== */
.anime-banner { position: relative; width: 100%; height: clamp(280px, 38vh, 480px); background-size: cover; background-position: center 20%; margin-top: var(--header-height); }
.anime-banner-overlay { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 0%, rgba(10,10,15,0.75) 60%, rgba(10,10,15,0.3) 100%); }
.anime-main { display: flex; gap: 2rem; margin-top: -80px; position: relative; z-index: 2; padding-bottom: 3rem; }
.container { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 clamp(1rem, 3vw, 2rem); }
.anime-poster { flex-shrink: 0; width: min(260px, 35vw); border-radius: var(--radius-lg); overflow: hidden; border: 2px solid var(--glass-border); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
.anime-poster img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
.anime-info { flex: 1; min-width: 0; }
.anime-title { font-size: clamp(1.6rem, 3vw, 2.4rem); font-weight: 800; line-height: 1.1; margin-bottom: 0.5rem; }
.anime-meta { display: flex; flex-wrap: wrap; gap: 0.75rem; color: var(--text-2); font-size: 0.9rem; margin-bottom: 1rem; }
.anime-meta span { display: flex; align-items: center; gap: 0.25rem; }
.anime-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem 1.5rem; border-radius: var(--radius); font-weight: 600; font-size: clamp(0.85rem, 1vw, 0.95rem); border: none; transition: transform var(--transition), box-shadow var(--transition); white-space: nowrap; }
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 20px var(--primary-glow); }
.btn-secondary { background: var(--glass); color: var(--text); border: 1px solid var(--glass-border); backdrop-filter: blur(10px); }
.btn-secondary:hover { background: var(--surface-2); border-color: var(--primary); }
.anime-synopsis { color: var(--text-2); line-height: 1.7; font-size: clamp(0.85rem, 1.1vw, 0.95rem); margin-bottom: 1.5rem; max-width: 800px; }
.genre-tag { display: inline-block; padding: 0.35rem 0.75rem; border-radius: 20px; background: rgba(139,92,246,0.15); border: 1px solid rgba(139,92,246,0.3); color: var(--accent); font-size: 0.8rem; font-weight: 600; margin: 0 0.5rem 0.5rem 0; }
.section-block { margin-top: 2.5rem; }
.section-block h3 { font-size: clamp(1.1rem, 2vw, 1.4rem); font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
.section-block h3::before { content: ''; width: 4px; height: 1.1em; background: var(--primary); border-radius: 2px; }
.trailer-wrap { position: relative; width: 100%; max-width: 900px; aspect-ratio: 16/9; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--glass-border); background: #000; }
.trailer-wrap iframe { width: 100%; height: 100%; border: none; }
.episode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.75rem; }
.episode-btn { padding: 0.75rem; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--glass-border); color: var(--text); font-weight: 600; text-align: center; transition: background var(--transition), border-color var(--transition), color var(--transition); }
.episode-btn:hover { background: var(--primary); border-color: var(--primary); color: white; }
.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: var(--gap); }
.char-card { background: var(--surface); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--glass-border); text-align: center; transition: transform var(--transition); }
.char-card:hover { transform: translateY(-4px); }
.char-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
.char-name { font-size: 0.8rem; font-weight: 600; padding: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.slider-container { position: relative; width: 100%; overflow: hidden; }
.slider-track { display: flex; gap: var(--gap); overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 4px 0; }
.slider-track::-webkit-scrollbar { display: none; }
.anime-card { position: relative; border-radius: var(--radius); overflow: hidden; background: var(--surface); cursor: pointer; flex: 0 0 auto; width: calc((100% - (var(--visible, 5) - 1) * var(--gap)) / var(--visible, 5)); scroll-snap-align: start; transition: transform var(--transition), box-shadow var(--transition); border: 1px solid var(--glass-border); }
.anime-card:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 20px var(--primary-glow); border-color: rgba(139,92,246,0.3); }
.card-image-wrapper { position: relative; aspect-ratio: 2/3; overflow: hidden; }
.card-image-wrapper img { width: 100%; height: 100%; object-fit: cover; }
.card-badges { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 4px; z-index: 2; }
.badge { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 6px; border-radius: 4px; backdrop-filter: blur(4px); }
.badge-score { background: rgba(0,0,0,0.75); color: #fbbf24; } .badge-type { background: rgba(255,255,255,0.2); color: white; } .badge-hd { background: var(--primary); color: white; }
.card-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 100%); }
.card-title { font-size: clamp(0.75rem, 0.9vw, 0.9rem); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.skeleton-card { background: var(--surface); border: 1px solid var(--glass-border); pointer-events: none; }
.skeleton-img { width: 100%; aspect-ratio: 2/3; background: linear-gradient(90deg, var(--surface-2) 25%, #252530 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
.skeleton-text { height: 16px; margin: 10px; background: linear-gradient(90deg, var(--surface-2) 25%, #252530 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.footer { border-top: 1px solid var(--glass-border); padding: 2rem clamp(1rem, 3vw, 2rem); text-align: center; color: var(--text-3); font-size: 0.85rem; margin-top: 2rem; }
@media (max-width: 768px) {
  .anime-main { flex-direction: column; align-items: center; margin-top: -60px; }
  .anime-poster { width: min(200px, 55vw); }
  .anime-info { width: 100%; text-align: center; }
  .anime-synopsis { text-align: left; }
  .anime-actions { justify-content: center; }
  .anime-card { width: calc((100% - (3 - 1) * var(--gap)) / 3); }
}
@media (min-width: 769px) and (max-width: 1024px) { .anime-card { width: calc((100% - (4 - 1) * var(--gap)) / 4); } }
@media (min-width: 1025px) { .anime-card { width: calc((100% - (5 - 1) * var(--gap)) / 5); } }
</style>
</head>

<script>
class JikanAPI {
  constructor() { this.base='https://api.jikan.moe/v4'; this.prefix='af_cache_'; this.ttl=8*60*1000; this.timeout=10000; this.retries=3; this.delay=1200; }
  key(ep){return this.prefix+ep.replace(/[^a-zA-Z0-9]/g,'_');}
  getCache(ep){try{const r=localStorage.getItem(this.key(ep));if(!r)return null;const p=JSON.parse(r);if(Date.now()-p.ts>this.ttl)return null;return p.data;}catch(e){return null;}}
  setCache(ep,data){try{localStorage.setItem(this.key(ep),JSON.stringify({data,ts:Date.now()}));}catch(e){}}
  async fetch(url,signal){const c=new AbortController();const t=setTimeout(()=>c.abort(),this.timeout);try{const r=await fetch(url,{signal:signal||c.signal});clearTimeout(t);return r;}catch(e){clearTimeout(t);throw e;}}
  async get(ep,signal){const c=this.getCache(ep);if(c)return c;let last;for(let i=0;i<<this.retries;i++){try{if(i>0)await new Promise(r=>setTimeout(r,i*this.delay));const r=await this.fetch(`${this.base}${ep}`,signal);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(!j||!j.data)throw new Error('Empty');this.setCache(ep,j.data);return j.data;}catch(e){last=e;}}console.error('API fail',ep,last);return null;}
}
const $=s=>document.querySelector(s);
function initSidebar(){const m=$('#menu-btn'),s=$('#sidebar'),o=$('#sidebar-overlay'),c=$('#sidebar-close');const op=()=>{s.classList.add('active');o.classList.add('active');document.body.style.overflow='hidden';};const cl=()=>{s.classList.remove('active');o.classList.remove('active');document.body.style.overflow='';};m.addEventListener('click',op);c.addEventListener('click',cl);o.addEventListener('click',cl);}
class SearchOverlay{constructor(api){this.api=api;this.overlay=$('#search-overlay');this.input=$('#search-input');this.results=$('#search-results');this.openBtn=$('#search-btn');this.closeBtn=$('#search-close');this.timer=null;this.isOpen=false;this.bind();}bind(){this.openBtn.addEventListener('click',()=>this.open());this.closeBtn.addEventListener('click',()=>this.close());this.overlay.addEventListener('click',e=>{if(e.target===this.overlay)this.close();});this.input.addEventListener('input',e=>this.onInput(e.target.value));document.addEventListener('keydown',e=>{if(e.key==='/'&&!this.isOpen){e.preventDefault();this.open();}if(e.key==='Escape'&&this.isOpen)this.close();});}open(){this.isOpen=true;this.overlay.classList.add('active');document.body.style.overflow='hidden';setTimeout(()=>this.input.focus(),50);}close(){this.isOpen=false;this.overlay.classList.remove('active');document.body.style.overflow='';this.input.value='';this.results.innerHTML='';}onInput(q){clearTimeout(this.timer);if(!q.trim()){this.results.innerHTML='';return;}this.results.innerHTML='<div class="search-loading">Searching...</div>';this.timer=setTimeout(()=>this.search(q.trim()),350);}async search(q){const d=await this.api.get(`/anime?q=${encodeURIComponent(q)}&limit=10&sfw=true`);if(!d||!d.length){this.results.innerHTML='<div class="search-empty">No results</div>';return;}this.results.innerHTML='';const f=document.createDocumentFragment();d.forEach(a=>{const el=document.createElement('a');el.className='search-result-item';el.href=`anime.html?id=${a.mal_id}`;const img=a.images?.jpg?.image_url||'';const t=a.title_english||a.title||'Unknown';el.innerHTML=`<img src="${img}" alt="" loading="lazy" onerror="this.style.display='none'"><div class="search-result-info"><div class="search-result-title">${t}</div><div class="search-result-meta">${a.type||'TV'} • ${a.score?'★ '+a.score:'No score'}</div></div>`;f.appendChild(el);});this.results.appendChild(f);}}

function createCard(a){const el=document.createElement('div');el.className='anime-card';el.onclick=()=>location.href=`anime.html?id=${a.mal_id}`;const img=a.images?.jpg?.large_image_url||a.images?.jpg?.image_url||'';const t=a.title_english||a.title||'Unknown';const s=a.score?a.score.toFixed(1):'N/A';const ty=a.type||'TV';el.innerHTML=`<div class="card-image-wrapper"><img src="${img}" alt="${t.replace(/"/g,'&quot;')}" loading="lazy" onerror="this.style.opacity=0.5"><div class="card-badges"><span class="badge badge-score">★ ${s}</span><span class="badge badge-type">${ty}</span><span class="badge badge-hd">HD</span></div></div><div class="card-info"><div class="card-title" title="${t.replace(/"/g,'&quot;')}">${t}</div></div>`;return el;}

async function loadAnime(){
  const api=new JikanAPI();
  initSidebar();
  new SearchOverlay(api);
  const params=new URLSearchParams(location.search);
  const id=params.get('id');
  if(!id){$('#anime-info').innerHTML='<h2 style="color:var(--text-2);padding:2rem 0">No anime ID provided.</h2>';return;}

  const [details,chars,recs,eps]=await Promise.allSettled([
    api.get(`/anime/${id}/full`),
    api.get(`/anime/${id}/characters`),
    api.get(`/anime/${id}/recommendations`),
    api.get(`/anime/${id}/episodes?page=1`)
  ]);

  const anime=details.status==='fulfilled'?details.value:null;
  if(!anime){$('#anime-info').innerHTML='<h2 style="color:var(--text-2);padding:2rem 0">Failed to load anime details.</h2>';return;}

  // Banner & Poster
  const bannerImg=anime.images?.jpg?.large_image_url||anime.images?.jpg?.image_url||'';
  $('#anime-banner').style.backgroundImage=`url('${bannerImg}')`;
  $('#anime-poster').innerHTML=`<img src="${anime.images?.jpg?.large_image_url||anime.images?.jpg?.image_url||''}" alt="${(anime.title_english||anime.title||'').replace(/"/g,'&quot;')}" loading="eager">`;

  // Info
  const genres=(anime.genres||[]).map(g=>`<span class="genre-tag">${g.name}</span>`).join('');
  const studios=(anime.studios||[]).map(s=>s.name).join(', ')||'Unknown';
  $('#anime-info').innerHTML=`
    <h1 class="anime-title">${anime.title_english||anime.title||'Unknown'}</h1>
    <div class="anime-meta">
      <span>★ ${anime.score||'N/A'}</span><span>•</span>
      <span>${anime.type||'TV'}</span><span>•</span>
      <span>${anime.episodes||'?'} EPS</span><span>•</span>
      <span>${anime.status||'Unknown'}</span><span>•</span>
      <span>${anime.aired?.string?.split(' to ')[0]||'Unknown'}</span><span>•</span>
      <span>${studios}</span>
    </div>
    <div class="anime-actions">
      <a href="watch.html?id=${id}&ep=1" class="btn btn-primary">▶ Watch Now</a>
      <a href="watch.html?id=${id}&ep=1" class="btn btn-secondary">Episode 1</a>
    </div>
    <div style="margin-bottom:0.75rem">${genres}</div>
    <p class="anime-synopsis">${anime.synopsis||'No synopsis available.'}</p>
  `;

  // Trailer
  if(anime.trailer?.embed_url){
    $('#trailer-section').style.display='block';
    $('#trailer-wrap').innerHTML=`<iframe src="${anime.trailer.embed_url}" title="Trailer" allowfullscreen loading="lazy"></iframe>`;
  }

  // Episodes
  const epList=eps.status==='fulfilled'&&eps.value?(Array.isArray(eps.value)?eps.value:eps.value.data||[]):[];
  const epCount=anime.episodes||12;
  if(epList.length||epCount){
    $('#episodes-section').style.display='block';
    const grid=$('#episode-grid');
    grid.innerHTML='';
    const frag=document.createDocumentFragment();
    const total=epList.length?epList.length:epCount;
    for(let i=1;i<=Math.min(total,24);i++){
      const btn=document.createElement('a');
      btn.className='episode-btn'; btn.href=`watch.html?id=${id}&ep=${i}`;
      btn.textContent=i; frag.appendChild(btn);
    }
    grid.appendChild(frag);
  }

  // Characters
  const charList=chars.status==='fulfilled'&&chars.value?(Array.isArray(chars.value)?chars.value:chars.value.data||[]):[];
  if(charList.length){
    $('#chars-section').style.display='block';
    const grid=$('#char-grid'); grid.innerHTML='';
    const frag=document.createDocumentFragment();
    charList.slice(0,12).forEach(c=>{
      const ch=c.character||{};
      const el=document.createElement('div'); el.className='char-card';
      const img=ch.images?.jpg?.image_url||'';
      el.innerHTML=`<img src="${img}" alt="" loading="lazy" onerror="this.style.display='none'"><div class="char-name">${ch.name||'Unknown'}</div>`;
      frag.appendChild(el);
    });
    grid.appendChild(frag);
  }

  // Recommendations
  const recList=recs.status==='fulfilled'&&recs.value?(Array.isArray(recs.value)?recs.value:recs.value.data||[]):[];
  if(recList.length){
    $('#recs-section').style.display='block';
    const track=$('#recs-track'); track.innerHTML='';
    const frag=document.createDocumentFragment();
    recList.slice(0,12).forEach(r=>{ const entry=r.entry||{}; frag.appendChild(createCard(entry)); });
    track.appendChild(frag);
  }
}
loadAnime();
</script>
</body>
</html>
