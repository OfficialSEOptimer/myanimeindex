<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Anime details, episodes, characters, and streaming links.">
<meta name="theme-color" content="#050505">
<title>Anime Details - AnimeStream</title>
<style>
/* ==================== VARIABLES & RESET ==================== */
:root {
  --bg: #0a0a14;
  --surface: #12122a;
  --surface-2: #1a1a2e;
  --primary: #8b2be2;
  --primary-glow: rgba(138,43,226,0.5);
  --secondary: #a78bfa;
  --text: #f3f4f6;
  --text-muted: #9ca3af;
  --border: rgba(255,255,255,0.08);
  --radius: 12px;
  --radius-lg: 16px;
  --header-height: 64px;
  --z-header: 100;
  --z-sidebar: 200;
  --z-search: 300;
  --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  overflow-x: hidden;
  max-width: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-top: var(--header-height);
}
img { max-width: 100%; height: auto; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
ul, ol { list-style: none; }

/* ==================== UTILITIES ==================== */
.glass {
  background: rgba(20,20,35,0.8);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
}
.skeleton {
  background: linear-gradient(90deg, var(--surface-2) 25%, #222240 50%, var(--surface-2) 75%);
  background-size: 200% 100%;
  animation: skeleton-loading 1.5s infinite;
  border-radius: var(--radius);
}
@keyframes skeleton-loading {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.fade-in { animation: fadeIn 0.5s ease forwards; opacity: 0; }
@keyframes fadeIn { to { opacity: 1; } }
.text-gradient {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.clamp-2 {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.clamp-3 {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ==================== HEADER (matching index.html) ==================== */
.site-header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--header-height);
  z-index: var(--z-header);
  background: rgba(10,10,20,0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 clamp(12px, 3vw, 30px);
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.hamburger-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  border-radius: 8px;
  color: #fff;
  transition: background 0.2s;
}
.hamburger-btn:hover { background: rgba(255,255,255,0.1); }
.hamburger-btn svg { width: 22px; height: 18px; }
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: clamp(18px, 2.5vw, 24px);
  color: #fff;
  letter-spacing: -0.5px;
  text-decoration: none;
}
.logo-icon-img { width: 32px; height: 32px; }
.logo-accent { color: var(--primary); }
.header-actions { display: flex; align-items: center; }
.search-toggle-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  border-radius: 50%;
  color: #fff;
  transition: background 0.2s;
}
.search-toggle-btn:hover { background: rgba(255,255,255,0.1); }
.search-toggle-btn svg { width: 20px; height: 20px; }

/* ==================== SIDEBAR ==================== */
.mobile-sidebar {
  position: fixed;
  inset: 0;
  z-index: var(--z-sidebar);
  display: none;
}
.mobile-sidebar.active { display: block; }
.sidebar-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.7);
  opacity: 0;
  transition: opacity 0.3s;
}
.mobile-sidebar.active .sidebar-backdrop { opacity: 1; }
.sidebar-panel {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: min(280px, 80vw);
  background: #0d0d20;
  border-right: 1px solid rgba(255,255,255,0.08);
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  padding: 20px;
  display: flex;
  flex-direction: column;
}
.mobile-sidebar.active .sidebar-panel { transform: translateX(0); }
.sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.sidebar-logo { font-weight: 700; font-size: 18px; color: #fff; }
.sidebar-close { background: none; border: none; color: #fff; font-size: 20px; padding: 4px; cursor: pointer; }
.sidebar-nav { display: flex; flex-direction: column; gap: 6px; }
.sidebar-link {
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 15px;
  color: #ccc;
  transition: 0.2s;
  text-decoration: none;
}
.sidebar-link:hover, .sidebar-link.active { background: rgba(138,43,226,0.2); color: #fff; }

/* ==================== SEARCH OVERLAY ==================== */
.search-overlay {
  position: fixed;
  inset: 0;
  z-index: var(--z-search);
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding-top: clamp(60px, 12vh, 100px);
}
.search-overlay.active { display: flex; }
.search-overlay-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(5,5,15,0.9);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.search-overlay-content {
  position: relative;
  width: min(600px, 90vw);
  max-width: 100%;
  z-index: 1;
  background: rgba(18,18,40,0.8);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 20px;
  backdrop-filter: blur(20px);
  box-shadow: 0 25px 50px rgba(0,0,0,0.6);
  animation: searchFadeIn 0.25s ease;
  overflow: hidden;
}
@keyframes searchFadeIn { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
.search-input-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(255,255,255,0.05);
  border-radius: 14px;
  padding: 6px 16px;
  border: 1px solid rgba(255,255,255,0.1);
}
.search-input-icon { flex-shrink: 0; }
.search-input {
  flex: 1;
  background: transparent;
  border: none;
  color: #fff;
  font-size: clamp(16px, 3vw, 18px);
  padding: 12px 0;
  outline: none;
  width: 100%;
  min-width: 0;
}
.search-input::placeholder { color: #777; }
.search-close-btn { color: #aaa; font-size: 18px; padding: 6px; cursor: pointer; }
.search-suggestions {
  margin-top: 14px;
  max-height: 60vh;
  overflow-y: auto;
  overflow-x: hidden;
  max-width: 100%;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 14px;
}
.search-suggestion-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  border-radius: 10px;
  transition: 0.2s;
  color: #ddd;
  text-decoration: none;
}
.search-suggestion-item:hover { background: rgba(138,43,226,0.2); }
.suggestion-img { width: 42px; height: 58px; object-fit: cover; border-radius: 6px; background: #1a1a2e; flex-shrink: 0; }
.suggestion-info { display: flex; flex-direction: column; overflow: hidden; }
.suggestion-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.suggestion-meta { font-size: 12px; color: #999; }
.search-no-results { text-align: center; color: #999; padding: 20px; font-size: 14px; grid-column: 1 / -1; }

/* ==================== FOOTER (matching index.html) ==================== */
.site-footer {
  background: rgba(10,10,20,0.95);
  border-top: 1px solid rgba(255,255,255,0.05);
  padding: 30px clamp(16px, 4vw, 40px);
  margin-top: 40px;
  text-align: center;
}
.footer-inner {
  max-width: 800px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.footer-brand { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.footer-logo { font-size: 20px; font-weight: 700; color: #fff; }
.footer-logo span { color: var(--primary); }
.footer-tagline { color: #888; font-size: 13px; }
.footer-socials { display: flex; gap: 16px; justify-content: center; margin: 6px 0; }
.social-link { font-size: 22px; transition: transform 0.2s; text-decoration: none; }
.social-link:hover { transform: scale(1.2); }
.footer-copy { font-size: 12px; color: #666; }

/* ==================== ANIME BANNER ==================== */
.anime-banner {
  position: relative;
  width: 100%;
  height: clamp(300px, 45vh, 550px);
  overflow: hidden;
}
.anime-banner-bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center 20%;
  filter: blur(2px) brightness(0.5);
}
.anime-banner-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(5,5,5,0.3) 0%, var(--bg) 100%);
}

/* ==================== ANIME DETAILS GRID ==================== */
.anime-details {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: clamp(20px, 3vw, 40px);
  padding: 0 clamp(16px, 3vw, 32px);
  max-width: 1200px;
  margin: -120px auto 0;
  position: relative;
  z-index: 2;
}
@media (max-width: 768px) {
  .anime-details {
    grid-template-columns: 1fr;
    margin-top: -80px;
  }
}
.anime-poster-wrap {
  width: clamp(160px, 22vw, 260px);
  flex-shrink: 0;
}
@media (max-width: 768px) {
  .anime-poster-wrap {
    width: min(200px, 60vw);
    margin: 0 auto;
  }
}
.anime-poster {
  width: 100%;
  aspect-ratio: 2/3;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  background: var(--surface-2);
}
.anime-poster img {
  width: 100%; height: 100%;
  object-fit: cover;
}
.anime-actions {
  display: flex; flex-direction: column; gap: 10px;
  margin-top: 16px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 20px;
  border-radius: 30px;
  font-size: 0.9rem;
  font-weight: 700;
  transition: var(--transition);
  white-space: nowrap;
  width: 100%;
}
.btn-primary {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 4px 24px rgba(138,43,226,0.5);
}
.btn-primary:hover {
  background: #9b4de8;
  box-shadow: 0 6px 32px rgba(138,43,226,0.7);
  transform: translateY(-2px);
}
.btn-secondary {
  background: rgba(255,255,255,0.08);
  border: 1.5px solid rgba(255,255,255,0.3);
  color: #fff;
}
.btn-secondary:hover { background: rgba(255,255,255,0.16); transform: translateY(-2px); }

/* Info */
.anime-info {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
}
.anime-title {
  font-size: clamp(1.5rem, 3vw, 2.5rem);
  font-weight: 800;
  line-height: 1.15;
}
.anime-alt-title {
  font-size: clamp(0.85rem, 1.2vw, 1rem);
  color: var(--text-muted);
  font-weight: 500;
}
.anime-meta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  font-size: 0.9rem;
}
.anime-score {
  display: flex; align-items: center; gap: 6px;
  background: rgba(251,191,36,0.12);
  padding: 6px 12px;
  border-radius: 8px;
  color: #fbbf24;
  font-weight: 800;
  font-size: 1rem;
}
.anime-score svg { width: 18px; height: 18px; fill: #fbbf24; }
.anime-meta-row .dot { width: 4px; height: 4px; background: var(--text-muted); border-radius: 50%; }
.anime-genres {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.anime-genre {
  padding: 5px 12px;
  background: rgba(138,43,226,0.12);
  border: 1px solid rgba(138,43,226,0.2);
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--secondary);
}
.anime-synopsis {
  font-size: clamp(0.85rem, 1vw + 0.2rem, 1rem);
  color: var(--text-muted);
  line-height: 1.7;
}
.anime-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
}
.stat-box {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  text-align: center;
}
.stat-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.stat-value {
  font-size: 1rem;
  font-weight: 700;
}

/* ==================== TABS ==================== */
.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-muted);
  white-space: nowrap;
  transition: var(--transition);
  flex-shrink: 0;
}
.tab-btn:hover { color: var(--text); background: var(--surface-2); }
.tab-btn.active {
  color: var(--primary);
  background: rgba(138,43,226,0.1);
}
.tab-panel { display: none; }
.tab-panel.active { display: block; animation: fadeIn 0.3s ease; }

/* ==================== EPISODE LIST ==================== */
#episodesList {
  max-height: 70vh;
  overflow-y: auto;
  overflow-x: hidden;
  padding-right: 4px;
  scrollbar-width: thin;
  scrollbar-color: var(--surface-3) var(--surface-2);
}
#episodesList::-webkit-scrollbar { width: 6px; }
#episodesList::-webkit-scrollbar-track { background: var(--surface-2); border-radius: 3px; }
#episodesList::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 3px; }
#episodesList::-webkit-scrollbar-thumb:hover { background: var(--primary); }

.episode-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}
@media (max-width: 640px) {
  .episode-grid { grid-template-columns: 1fr; }
}
.episode-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: var(--transition);
  cursor: pointer;
}
.episode-card:hover {
  background: var(--surface-3);
  border-color: var(--primary);
  transform: translateX(4px);
}
.episode-num {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  background: var(--primary);
  color: #fff;
  border-radius: 10px;
  font-weight: 800;
  font-size: 0.9rem;
  flex-shrink: 0;
}
.episode-info { flex: 1; min-width: 0; }
.episode-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 2px; }
.episode-date { font-size: 0.75rem; color: var(--text-muted); }
.episode-play {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: rgba(138,43,226,0.15);
  color: var(--primary);
  flex-shrink: 0;
}
.episode-play svg { width: 16px; height: 16px; fill: currentColor; }

/* ==================== CHARACTER CARDS ==================== */
.char-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 16px;
}
.char-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: var(--transition);
}
.char-card:hover { transform: translateY(-4px); border-color: var(--primary); }
.char-img {
  aspect-ratio: 1;
  overflow: hidden;
  background: var(--surface-3);
}
.char-img img { width: 100%; height: 100%; object-fit: cover; }
.char-name { padding: 10px; font-size: 0.8rem; font-weight: 600; text-align: center; }
.char-role { font-size: 0.7rem; color: var(--text-muted); text-align: center; padding-bottom: 10px; }

/* ==================== SLIDER / CAROUSEL ==================== */
.slider-wrap {
  position: relative;
  overflow: visible;
  border-radius: var(--radius-lg);
  padding: 4px 0;
}
.slider-track {
  display: flex;
  gap: clamp(10px, 1.2vw, 16px);
  overflow-x: auto;
  overflow-y: hidden;
  scroll-behavior: smooth;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  -ms-overflow-style: none;
  padding: 8px 4px 16px;
  touch-action: pan-x pan-y pinch-zoom;
  cursor: grab;
}
.slider-track::-webkit-scrollbar { display: none; }
.slider-track.dragging { scroll-behavior: auto; cursor: grabbing; scroll-snap-type: none; user-select: none; }
.slider-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(10,10,10,0.85);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(139,92,246,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  opacity: 1;
  transition: all 0.25s;
  color: #fff;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.slider-arrow:hover { background: var(--primary); border-color: var(--primary); transform: translateY(-50%) scale(1.12); box-shadow: 0 0 20px var(--primary-glow); }
.slider-arrow.prev { left: -10px; }
.slider-arrow.next { right: -10px; }
.slider-arrow svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.5; pointer-events: none; }

/* ==================== TRAILER ==================== */
.trailer-wrap {
  width: 100%;
  aspect-ratio: 16/9;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--surface-2);
}
.trailer-wrap iframe { width: 100%; height: 100%; border: none; }

/* ==================== GRID FALLBACK ==================== */
.grid-section {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 16px;
}
@media (max-width: 768px) { .grid-section { grid-template-columns: repeat(3, 1fr); gap: 12px; } }
@media (max-width: 480px) { .grid-section { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

@media (max-width: 768px) {
  .anime-banner { height: 250px; }
  .anime-stats { grid-template-columns: repeat(2, 1fr); }
  .char-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 480px) {
  .char-grid { grid-template-columns: repeat(2, 1fr); }
  .slider-arrow { width: 34px; height: 34px; }
  .slider-arrow.prev { left: 2px; }
  .slider-arrow.next { right: 2px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<!-- ==================== HEADER (matching index.html) ==================== -->
<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
      <svg width="22" height="18" viewBox="0 0 22 18" fill="none"><rect width="22" height="2.5" rx="1.25" fill="currentColor"/><rect y="7.5" width="22" height="2.5" rx="1.25" fill="currentColor"/><rect y="15" width="22" height="2.5" rx="1.25" fill="currentColor"/></svg>
    </button>
    <a href="index.html" class="logo">
      <img class="logo-icon-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%238b2be2'/%3E%3Cpolygon points='12,8 24,16 12,24' fill='white'/%3E%3C/svg%3E" alt="AnimeStream Logo">
      Anime<span class="logo-accent">Stream</span>
    </a>
    <div class="header-actions">
      <button class="search-toggle-btn" id="searchToggleBtn" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ==================== SIDEBAR ==================== -->
<aside class="mobile-sidebar" id="mobileSidebar">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<!-- ==================== SCRIPTS ==================== -->
<script>
(function() {
  'use strict';

  const API_BASE = 'https://api.jikan.moe/v4';
  const CACHE_TTL = 5 * 60 * 1000;
  const RATE_DELAY = 400;

  const ApiEngine = {
    cache: {}, lastRequest: 0,
    getCacheKey(url) { return 'cache_' + url; },
    getCached(url) {
      const key = this.getCacheKey(url);
      const item = this.cache[key];
      if (!item) {
        try {
          const raw = localStorage.getItem(key);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Date.now() - parsed.time < CACHE_TTL) { this.cache[key] = parsed; return parsed.data; }
          }
        } catch(e) {}
        return null;
      }
      if (Date.now() - item.time < CACHE_TTL) return item.data;
      return null;
    },
    setCache(url, data) {
      const key = this.getCacheKey(url);
      const payload = { data, time: Date.now() };
      this.cache[key] = payload;
      try { localStorage.setItem(key, JSON.stringify(payload)); } catch(e) {}
    },
    async fetchWithTimeout(url, timeout = 10000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(url, { signal: controller.signal });
        clearTimeout(id);
        return response;
      } catch (e) { clearTimeout(id); throw e; }
    },
    async fetch(url, retries = 3) {
      const cached = this.getCached(url);
      if (cached) return cached;
      const now = Date.now();
      const wait = Math.max(0, this.lastRequest + RATE_DELAY - now);
      if (wait > 0) await new Promise(r => setTimeout(r, wait));
      this.lastRequest = Date.now();
      let lastError;
      for (let i = 0; i < retries; i++) {
        try {
          if (i > 0) await new Promise(r => setTimeout(r, 1200 * i));
          const response = await this.fetchWithTimeout(url);
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const json = await response.json();
          if (!json || !json.data) throw new Error('Invalid response');
          this.setCache(url, json);
          return json;
        } catch (e) { lastError = e; }
      }
      throw lastError;
    },
    async fetchSafe(url, fallbackData = null) {
      try { return await this.fetch(url); }
      catch (e) { console.warn('API fetch failed:', url, e.message); return { data: fallbackData }; }
    }
  };

  function getParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  function sanitize(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function getTitle(anime) {
    return sanitize(anime.title_english || anime.title || 'Unknown');
  }

  function getImage(anime) {
    if (!anime.images || !anime.images.jpg) return '';
    return anime.images.jpg.large_image_url || anime.images.jpg.image_url || '';
  }

  function getPoster(anime) {
    if (!anime.images || !anime.images.jpg) return '';
    return anime.images.jpg.image_url || anime.images.jpg.small_image_url || '';
  }

  // ==================== SLIDER ====================
  const SliderRegistry = new Map();

  function initSlider(trackId) {
    const track = document.getElementById(trackId);
    if (!track || SliderRegistry.has(trackId)) return;
    let isDown = false, startX = 0, scrollLeft = 0;
    track.addEventListener('mousedown', (e) => { isDown = true; startX = e.pageX - track.offsetLeft; scrollLeft = track.scrollLeft; track.style.cursor = 'grabbing'; });
    track.addEventListener('mouseleave', () => { isDown = false; track.style.cursor = 'grab'; });
    track.addEventListener('mouseup', () => { isDown = false; track.style.cursor = 'grab'; });
    track.addEventListener('mousemove', (e) => { if (!isDown) return; e.preventDefault(); const x = e.pageX - track.offsetLeft; track.scrollLeft = scrollLeft - (x - startX); });
    track.addEventListener('wheel', (e) => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); track.scrollLeft += e.deltaY; } }, { passive: false });
    SliderRegistry.set(trackId, track);
  }

  function slideTrack(trackId, direction) {
    const track = document.getElementById(trackId);
    if (!track) return;
    const card = track.querySelector('.anime-card');
    if (!card) return;
    const cardWidth = card.offsetWidth + parseFloat(getComputedStyle(track).gap || 16);
    track.scrollBy({ left: direction * cardWidth * 2, behavior: 'smooth' });
  }

  document.querySelectorAll('.slider-arrow').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const target = btn.dataset.target;
      const direction = btn.classList.contains('prev') ? -1 : 1;
      slideTrack('slider-' + target, direction);
    });
  });

  // ==================== RENDER CARD ====================
  function renderAnimeCard(anime) {
    const malId = anime.mal_id || 0;
    const img = getImage(anime) || 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
    const title = getTitle(anime);
    return `
      <a href="anime.html?id=${malId}" class="anime-card fade-in" style="min-width: 140px; scroll-snap-align: start;">
        <div style="position:relative; aspect-ratio:2/3; overflow:hidden; border-radius:8px;">
          <img src="${img}" alt="${title}" style="width:100%; height:100%; object-fit:cover;">
          <div style="position:absolute; inset:0; background:linear-gradient(transparent 50%, rgba(0,0,0,0.8));"></div>
        </div>
        <div style="padding:8px; font-size:0.8rem; font-weight:600;">${title}</div>
      </a>
    `;
  }

  // ==================== LOAD ANIME DETAILS ====================
  async function loadAnimeDetails() {
    const malId = getParam('id');
    if (!malId) {
      document.getElementById('animeInfo').innerHTML = '<div class="search-no-results">No anime ID provided.</div>';
      return;
    }

    try {
      const res = await ApiEngine.fetchSafe(`${API_BASE}/anime/${malId}/full`);
      const anime = (res && res.data) ? res.data : null;
      if (!anime) { document.getElementById('animeInfo').innerHTML = '<div class="search-no-results">Anime not found.</div>'; return; }

      const bannerBg = document.getElementById('bannerBg');
      const bannerImg = getImage(anime);
      if (bannerBg && bannerImg) bannerBg.style.backgroundImage = `url('${bannerImg}')`;

      const posterEl = document.getElementById('animePoster');
      const posterImg = getPoster(anime);
      if (posterEl && posterImg) posterEl.innerHTML = `<img src="${posterImg}" alt="${getTitle(anime)}">`;

      const watchBtn = document.getElementById('watchBtn');
      if (watchBtn) watchBtn.href = `watch.html?id=${malId}&ep=1`;

      const infoEl = document.getElementById('animeInfo');
      const title = getTitle(anime);
      const altTitle = sanitize(anime.title_japanese || '');
      const genres = (anime.genres || []).map(g => `<span class="anime-genre">${sanitize(g.name)}</span>`).join('');
      const studios = (anime.studios || []).map(s => sanitize(s.name)).join(', ') || 'Unknown';
      const score = anime.score ? anime.score.toFixed(2) : 'N/A';
      const episodes = anime.episodes || '?';
      const status = sanitize(anime.status || 'Unknown');
      const duration = sanitize(anime.duration || 'Unknown');
      const rating = sanitize(anime.rating || 'Unknown');
      const synopsis = sanitize(anime.synopsis || 'No synopsis available.');
      const year = anime.year || (anime.aired && anime.aired.from ? new Date(anime.aired.from).getFullYear() : '');
      const season = sanitize(anime.season || '') + (anime.year ? ' ' + anime.year : '');

      infoEl.innerHTML = `
        <h1 class="anime-title">${title}</h1>
        ${altTitle ? `<div class="anime-alt-title">${altTitle}</div>` : ''}
        <div class="anime-meta-row">
          <span class="anime-score"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>${score}</span>
          <span class="dot"></span><span>${episodes} Episodes</span>
          <span class="dot"></span><span>${status}</span>
          <span class="dot"></span><span>${duration}</span>
        </div>
        <div class="anime-genres">${genres}</div>
        <p class="anime-synopsis">${synopsis}</p>
        <div class="anime-stats">
          <div class="stat-box"><div class="stat-label">Type</div><div class="stat-value">${sanitize(anime.type || 'TV')}</div></div>
          <div class="stat-box"><div class="stat-label">Studio</div><div class="stat-value">${studios}</div></div>
          <div class="stat-box"><div class="stat-label">Season</div><div class="stat-value">${season || 'Unknown'}</div></div>
          <div class="stat-box"><div class="stat-label">Rating</div><div class="stat-value">${rating}</div></div>
          <div class="stat-box"><div class="stat-label">Rank</div><div class="stat-value">#${anime.rank || '?'}</div></div>
          <div class="stat-box"><div class="stat-label">Popularity</div><div class="stat-value">#${anime.popularity || '?'}</div></div>
        </div>
      `;

      const trailerWrap = document.getElementById('trailerWrap');
      const trailerBtn = document.getElementById('trailerBtn');
      const trailerUrl = anime.trailer && anime.trailer.embed_url ? anime.trailer.embed_url : null;
      if (trailerUrl && trailerWrap) {
        trailerWrap.innerHTML = `<iframe src="${trailerUrl}" allowfullscreen loading="lazy"></iframe>`;
        trailerBtn.style.display = 'block';
        trailerBtn.addEventListener('click', () => {
          document.querySelector('[data-tab="trailer"]').click();
          trailerWrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      } else {
        if (trailerBtn) trailerBtn.style.display = 'none';
      }

      loadEpisodes(malId, anime.episodes);
      loadCharacters(malId);
      loadRelations(malId);
      loadRecommendations(malId);
    } catch (e) {
      console.error(e);
      document.getElementById('animeInfo').innerHTML = '<div class="search-no-results">Failed to load anime details.</div>';
    }
  }

  async function loadEpisodes(malId, totalEps) {
    const container = document.getElementById('episodesList');
    if (!container) return;
    try {
      const res = await ApiEngine.fetchSafe(`${API_BASE}/anime/${malId}/episodes?page=1`);
      const episodes = (res && res.data) ? res.data : [];
      if (episodes.length) {
        container.innerHTML = episodes.slice(0, 500).map(ep => `
          <a href="watch.html?id=${malId}&ep=${ep.mal_id}" class="episode-card fade-in">
            <div class="episode-num">${ep.mal_id}</div>
            <div class="episode-info"><div class="episode-title clamp-2">${sanitize(ep.title || 'Episode ' + ep.mal_id)}</div><div class="episode-date">${sanitize(ep.aired || '')}</div></div>
            <div class="episode-play"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
          </a>
        `).join('');
      } else {
        const count = totalEps || 12;
        container.innerHTML = Array.from({length: count}, (_, i) => `
          <a href="watch.html?id=${malId}&ep=${i+1}" class="episode-card fade-in">
            <div class="episode-num">${i+1}</div>
            <div class="episode-info"><div class="episode-title">Episode ${i+1}</div></div>
            <div class="episode-play"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
          </a>
        `).join('');
      }
    } catch (e) { container.innerHTML = '<div class="search-no-results">Failed to load episodes.</div>'; }
  }

  async function loadCharacters(malId) {
    const container = document.getElementById('charGrid');
    if (!container) return;
    try {
      const res = await ApiEngine.fetchSafe(`${API_BASE}/anime/${malId}/characters`);
      const chars = (res && res.data) ? res.data.slice(0, 12) : [];
      container.innerHTML = chars.length ? chars.map(c => {
        const char = c.character || {};
        const img = char.images?.jpg?.image_url || '';
        return `<div class="char-card fade-in"><div class="char-img"><img src="${img}" alt="${sanitize(char.name)}"></div><div class="char-name">${sanitize(char.name)}</div><div class="char-role">${sanitize(c.role)}</div></div>`;
      }).join('') : '<div class="search-no-results">No characters found.</div>';
    } catch (e) { container.innerHTML = '<div class="search-no-results">Failed to load characters.</div>'; }
  }

  async function loadRelations(malId) {
    const container = document.getElementById('slider-relations');
    if (!container) return;
    try {
      const res = await ApiEngine.fetchSafe(`${API_BASE}/anime/${malId}/relations`);
      const data = (res && res.data) ? res.data : [];
      let items = [];
      data.forEach(group => (group.entry || []).forEach(entry => { if (entry.type === 'anime') items.push({ mal_id: entry.mal_id, title: entry.name }); }));
      if (!items.length) { container.innerHTML = '<div class="search-no-results">No relations found.</div>'; return; }
      const enriched = await Promise.all(items.map(async item => {
        const detail = await ApiEngine.fetchSafe(`${API_BASE}/anime/${item.mal_id}`);
        return detail.data || { mal_id: item.mal_id, title: item.title, images: { jpg: {} } };
      }));
      container.innerHTML = enriched.map(a => renderAnimeCard(a)).join('');
      initSlider('slider-relations');
    } catch (e) { container.innerHTML = '<div class="search-no-results">Failed to load relations.</div>'; }
  }

  async function loadRecommendations(malId) {
    const container = document.getElementById('slider-recommendations');
    if (!container) return;
    try {
      const res = await ApiEngine.fetchSafe(`${API_BASE}/anime/${malId}/recommendations`);
      const data = (res && res.data) ? res.data.slice(0, 15) : [];
      if (!data.length) { container.innerHTML = '<div class="search-no-results">No recommendations.</div>'; return; }
      const enriched = await Promise.all(data.map(async rec => {
        const detail = await ApiEngine.fetchSafe(`${API_BASE}/anime/${rec.entry.mal_id}`);
        return detail.data || rec.entry;
      }));
      container.innerHTML = enriched.map(a => renderAnimeCard(a)).join('');
      initSlider('slider-recommendations');
    } catch (e) { container.innerHTML = '<div class="search-no-results">Failed to load recommendations.</div>'; }
  }

  // ==================== SEARCH OVERLAY ====================
  const searchToggleBtn = document.getElementById('searchToggleBtn');
  const searchOverlay = document.getElementById('searchOverlay');
  const searchBackdrop = document.getElementById('searchBackdrop');
  const searchCloseBtn = document.getElementById('searchCloseBtn');
  const searchInput = document.getElementById('searchInput');
  const searchSuggestions = document.getElementById('searchSuggestions');
  let searchTimer;

  function openSearch() {
    searchOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';
    setTimeout(() => searchInput.focus(), 150);
  }
  function closeSearch() {
    searchOverlay.classList.remove('active');
    document.body.style.overflow = '';
    searchInput.value = '';
    searchSuggestions.innerHTML = '';
  }

  searchToggleBtn.addEventListener('click', openSearch);
  searchBackdrop.addEventListener('click', closeSearch);
  searchCloseBtn.addEventListener('click', closeSearch);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && searchOverlay.classList.contains('active')) closeSearch(); });

  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const query = searchInput.value.trim();
    if (query.length < 2) { searchSuggestions.innerHTML = '<div class="search-no-results">Type at least 2 characters</div>'; return; }
    searchTimer = setTimeout(async () => {
      try {
        const data = await ApiEngine.fetchSafe(`${API_BASE}/anime?q=${encodeURIComponent(query)}&limit=8`);
        const list = (data && data.data) ? data.data : [];
        if (!list.length) { searchSuggestions.innerHTML = '<div class="search-no-results">No results found</div>'; return; }
        searchSuggestions.innerHTML = list.map(a => `
          <a href="anime.html?id=${a.mal_id}" class="search-suggestion-item">
            <img src="${a.images?.jpg?.small_image_url || ''}" class="suggestion-img" onerror="this.style.display='none'">
            <div class="suggestion-info"><span class="suggestion-title">${sanitize(a.title)}</span><span class="suggestion-meta">${a.type} · ⭐${a.score||'?'}</span></div>
          </a>
        `).join('');
      } catch (e) { searchSuggestions.innerHTML = '<div class="search-no-results">Search failed</div>'; }
    }, 400);
  });

  // ==================== SIDEBAR ====================
  document.getElementById('hamburgerBtn').addEventListener('click', () => document.getElementById('mobileSidebar').classList.add('active'));
  document.getElementById('sidebarBackdrop').addEventListener('click', () => document.getElementById('mobileSidebar').classList.remove('active'));
  document.getElementById('sidebarClose').addEventListener('click', () => document.getElementById('mobileSidebar').classList.remove('active'));

  // ==================== TABS ====================
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  // Start
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', loadAnimeDetails);
  else loadAnimeDetails();
})();
</script>
