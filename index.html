<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="StreamFlix - Premium Anime Streaming Platform. Watch trending anime, top rated, and latest episodes online.">
    <meta name="keywords" content="anime, streaming, watch anime online, free anime, HD anime">
    <meta property="og:title" content="StreamFlix - Premium Anime Streaming">
    <meta property="og:description" content="Watch trending anime, top rated, and latest episodes online. Cinematic experience.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#0a0a0f">
    <title>StreamFlix - Premium Anime Streaming</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --bg2: #111118;
            --bg3: #1a1a25;
            --purple: #8b5cf6;
            --purple-glow: #a78bfa;
            --purple-dark: #6d28d9;
            --text: #e2e8f0;
            --text2: #a0a0b8;
            --text3: #6b6b80;
            --card-bg: #16161f;
            --border: #252535;
            --danger: #ef4444;
            --success: #22c55e;
            --gold: #f59e0b;
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --glass: rgba(22, 22, 31, 0.85);
            --glass-border: rgba(255, 255, 255, 0.06);
            --header-h: 64px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }
        html,
        body {
            overflow-x: hidden;
            max-width: 100%;
            width: 100%;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg2);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--purple-dark);
        }

        /* HEADER */
        .header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            height: var(--header-h);
            display: flex;
            align-items: center;
            padding: 0 clamp(12px, 3vw, 32px);
            gap: 16px;
            transition: var(--transition);
        }
        .header.scrolled {
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .hamburger {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            flex-shrink: 0;
            min-width: 40px;
            min-height: 40px;
            align-items: center;
            justify-content: center;
            z-index: 1001;
        }
        .hamburger:hover {
            background: var(--bg3);
            color: var(--purple-glow);
        }
        .logo {
            font-size: clamp(20px, 3vw, 26px);
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #c084fc, #8b5cf6, #6d28d9);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
            flex-shrink: 0;
            text-decoration: none;
            cursor: pointer;
            user-select: none;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: clamp(6px, 1.5vw, 20px);
            margin-left: auto;
            flex-shrink: 0;
        }
        .nav-links a {
            color: var(--text2);
            text-decoration: none;
            font-size: clamp(13px, 1.4vw, 15px);
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--purple-glow);
            background: rgba(139, 92, 246, 0.08);
        }
        .search-btn {
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text2);
            padding: 10px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
            min-width: 44px;
            min-height: 44px;
            justify-content: center;
            font-family: var(--font);
        }
        .search-btn:hover {
            border-color: var(--purple);
            color: var(--purple-glow);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
        }
        .search-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* SEARCH OVERLAY */
        .search-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: clamp(20px, 5vh, 60px) clamp(12px, 3vw, 32px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s ease, visibility 0.35s ease;
            max-width: 100%;
            overflow-x: hidden;
        }
        .search-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        .search-container {
            width: 100%;
            max-width: 640px;
            background: var(--bg2);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            max-width: min(640px, 100%);
            display: flex;
            flex-direction: column;
            max-height: 80vh;
        }
        .search-input-wrap {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .search-input-wrap svg {
            width: 22px;
            height: 22px;
            color: var(--text3);
            flex-shrink: 0;
        }
        .search-input-wrap input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text);
            font-size: clamp(16px, 2vw, 18px);
            outline: none;
            font-family: var(--font);
            min-width: 0;
        }
        .search-input-wrap input::placeholder {
            color: var(--text3);
        }
        .search-close {
            background: var(--bg3);
            border: none;
            color: var(--text2);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: var(--transition);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            min-height: 36px;
        }
        .search-close:hover {
            background: var(--danger);
            color: #fff;
        }
        .search-results {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            max-height: 60vh;
            padding: 8px;
            max-width: 100%;
        }
        .search-results::-webkit-scrollbar {
            width: 4px;
        }
        .search-result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            color: var(--text);
            max-width: 100%;
            overflow: hidden;
        }
        .search-result-item:hover {
            background: var(--bg3);
        }
        .search-result-item img {
            width: 44px;
            height: 62px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .search-result-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }
        .search-result-info .title {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }
        .search-result-info .meta {
            font-size: 12px;
            color: var(--text3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .search-no-results {
            text-align: center;
            padding: 32px;
            color: var(--text3);
        }
        .search-loading {
            text-align: center;
            padding: 32px;
            color: var(--purple-glow);
        }

        /* MOBILE SIDEBAR */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            z-index: 1500;
            background: rgba(0, 0, 0, 0.7);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .sidebar-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        .mobile-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: min(300px, 85vw);
            height: 100vh;
            z-index: 1600;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            overflow-x: hidden;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 100%;
        }
        .mobile-sidebar.open {
            transform: translateX(0);
        }
        .mobile-sidebar a {
            color: var(--text);
            text-decoration: none;
            padding: 14px 16px;
            border-radius: var(--radius);
            font-weight: 500;
            transition: var(--transition);
            font-size: 16px;
            display: block;
        }
        .mobile-sidebar a:hover,
        .mobile-sidebar a.active {
            background: rgba(139, 92, 246, 0.12);
            color: var(--purple-glow);
        }
        .mobile-sidebar .sidebar-logo {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #c084fc, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        /* HERO SLIDER */
        .hero-section {
            position: relative;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
            height: clamp(380px, 50vw, 600px);
            background: var(--bg);
        }
        .hero-track {
            display: flex;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.25, 0.1, 0.25, 1);
            will-change: transform;
            touch-action: pan-y pinch-zoom;
        }
        .hero-slide {
            min-width: 100%;
            height: 100%;
            position: relative;
            flex-shrink: 0;
            overflow: hidden;
        }
        .hero-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 30%;
            filter: brightness(0.45);
            transition: filter 0.8s ease;
        }
        .hero-slide:hover img {
            filter: brightness(0.55);
        }
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--bg) 0%, transparent 45%, rgba(10, 10, 15, 0.4) 100%);
        }
        .hero-content {
            position: absolute;
            bottom: clamp(30px, 8%, 70px);
            left: clamp(16px, 5vw, 60px);
            max-width: min(600px, 85vw);
            z-index: 2;
        }
        .hero-content .hero-title {
            font-size: clamp(24px, 4vw, 48px);
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 8px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
        }
        .hero-content .hero-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 8px;
            align-items: center;
        }
        .hero-content .hero-meta span {
            font-size: clamp(12px, 1.2vw, 14px);
            padding: 4px 10px;
            border-radius: 50px;
            font-weight: 600;
        }
        .hero-score {
            background: var(--gold);
            color: #000;
        }
        .hero-genres {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .hero-genres span {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 50px;
            backdrop-filter: blur(4px);
        }
        .hero-content .hero-synopsis {
            font-size: clamp(13px, 1.3vw, 15px);
            color: #ccc;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }
        .hero-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .hero-buttons a,
        .hero-buttons button {
            padding: clamp(10px, 1.5vw, 14px) clamp(18px, 2.5vw, 28px);
            border-radius: 50px;
            font-weight: 700;
            font-size: clamp(13px, 1.3vw, 15px);
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            font-family: var(--font);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-watch {
            background: var(--purple);
            color: #fff;
            box-shadow: 0 4px 25px rgba(139, 92, 246, 0.4);
        }
        .btn-watch:hover {
            background: var(--purple-dark);
            box-shadow: 0 6px 35px rgba(139, 92, 246, 0.6);
            transform: translateY(-2px);
        }
        .btn-details {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-details:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .hero-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 3;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            width: clamp(36px, 5vw, 48px);
            height: clamp(36px, 5vw, 48px);
            border-radius: 50%;
            cursor: pointer;
            font-size: clamp(16px, 2vw, 20px);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .hero-nav:hover {
            background: rgba(139, 92, 246, 0.5);
            border-color: var(--purple);
        }
        .hero-nav.prev {
            left: clamp(8px, 2vw, 20px);
        }
        .hero-nav.next {
            right: clamp(8px, 2vw, 20px);
        }
        .hero-dots {
            position: absolute;
            bottom: clamp(12px, 2vw, 20px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 3;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90vw;
        }
        .hero-dot {
            width: clamp(8px, 1vw, 12px);
            height: clamp(8px, 1vw, 12px);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            cursor: pointer;
            transition: var(--transition);
            border: none;
            padding: 0;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .hero-dot.active {
            background: var(--purple-glow);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.6);
            transform: scale(1.3);
        }

        /* WIDGET SECTION */
        .section-wrap {
            padding: clamp(16px, 3vw, 32px) clamp(12px, 3vw, 32px);
            max-width: 100%;
            overflow: hidden;
        }
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .section-title {
            font-size: clamp(18px, 2.2vw, 24px);
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #fff;
        }
        .section-title span {
            color: var(--purple-glow);
        }
        .slider-wrap {
            position: relative;
            max-width: 100%;
            overflow: hidden;
        }
        .slider-track {
            display: flex;
            gap: clamp(10px, 1.5vw, 16px);
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 8px 0;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x proximity;
            max-width: 100%;
            -webkit-scrollbar-width: none;
        }
        .slider-track::-webkit-scrollbar {
            display: none;
            height: 0;
            width: 0;
        }
        .slider-track.dragging {
            cursor: grabbing;
            scroll-behavior: auto;
        }
        .slider-track.dragging * {
            pointer-events: none;
        }
        .anime-card {
            flex-shrink: 0;
            width: clamp(140px, 16vw, 180px);
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            text-decoration: none;
            color: inherit;
            scroll-snap-align: start;
            display: block;
        }
        .anime-card:hover {
            transform: translateY(-6px);
            border-color: var(--purple);
            box-shadow: 0 12px 40px rgba(139, 92, 246, 0.25);
            z-index: 2;
        }
        .anime-card .card-img-wrap {
            position: relative;
            aspect-ratio: 3/4;
            overflow: hidden;
            background: var(--bg3);
        }
        .anime-card .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            loading: lazy;
        }
        .anime-card:hover .card-img-wrap img {
            transform: scale(1.08);
        }
        .anime-card .card-img-wrap .gradient-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            pointer-events: none;
        }
        .card-badges {
            position: absolute;
            top: 8px;
            left: 8px;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            z-index: 2;
            pointer-events: none;
        }
        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .badge-score {
            background: var(--gold);
            color: #000;
        }
        .badge-ep {
            background: var(--purple);
            color: #fff;
        }
        .badge-hd {
            background: var(--success);
            color: #000;
            font-size: 9px;
        }
        .badge-type {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 9px;
        }
        .anime-card .card-info {
            padding: 10px 12px;
        }
        .anime-card .card-info .card-title {
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
            line-height: 1.3;
        }
        .anime-card .card-info .card-meta {
            font-size: 11px;
            color: var(--text3);
            margin-top: 2px;
        }
        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            background: rgba(22, 22, 31, 0.9);
            border: 1px solid var(--border);
            color: #fff;
            width: clamp(32px, 4vw, 40px);
            height: clamp(32px, 4vw, 40px);
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            -webkit-tap-highlight-color: transparent;
        }
        .slider-wrap:hover .slider-arrow {
            opacity: 1;
            pointer-events: auto;
        }
        .slider-arrow:hover {
            background: var(--purple);
            border-color: var(--purple);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }
        .slider-arrow.prev {
            left: 4px;
        }
        .slider-arrow.next {
            right: 4px;
        }
        @media (max-width: 768px) {
            .slider-arrow {
                opacity: 0.7;
                pointer-events: auto;
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
            .slider-arrow.prev {
                left: 2px;
            }
            .slider-arrow.next {
                right: 2px;
            }
        }

        /* SKELETON */
        .skeleton {
            background: linear-gradient(90deg, var(--bg3) 25%, #222 50%, var(--bg3) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius);
        }
        .skeleton-card {
            flex-shrink: 0;
            width: clamp(140px, 16vw, 180px);
            aspect-ratio: 3/4;
            border-radius: var(--radius);
        }
        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }
        .skeleton-hero {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            z-index: 5;
            border-radius: 0;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            padding: clamp(24px, 4vw, 40px) clamp(16px, 3vw, 32px);
            border-top: 1px solid var(--border);
            color: var(--text3);
            font-size: 13px;
            background: var(--bg2);
        }
        .footer .social-icons {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .footer .social-icons a {
            color: var(--text2);
            text-decoration: none;
            font-size: 20px;
            transition: var(--transition);
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }
        .footer .social-icons a:hover {
            color: var(--purple-glow);
            background: rgba(139, 92, 246, 0.1);
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }
            .nav-links {
                display: none;
            }
            .hero-section {
                height: clamp(300px, 60vw, 420px);
            }
            .hero-content {
                bottom: 40px;
                left: 16px;
                max-width: 88vw;
            }
            .hero-nav {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
            .anime-card {
                width: clamp(120px, 28vw, 150px);
            }
            .search-btn span {
                display: none;
            }
            .search-btn {
                padding: 10px 12px;
                border-radius: 50%;
            }
            .search-container {
                max-width: 95vw;
                max-height: 70vh;
            }
        }
        @media (max-width: 480px) {
            .hero-section {
                height: clamp(260px, 70vw, 340px);
            }
            .hero-content .hero-synopsis {
                -webkit-line-clamp: 2;
                font-size: 12px;
            }
            .hero-buttons a,
            .hero-buttons button {
                padding: 8px 14px;
                font-size: 12px;
            }
            .anime-card {
                width: clamp(110px, 35vw, 140px);
            }
            .section-title {
                font-size: 16px;
            }
            .hero-dots {
                gap: 4px;
                bottom: 8px;
            }
            .hero-dot {
                width: 6px;
                height: 6px;
            }
        }
        @media (min-width: 1400px) {
            .hero-section {
                height: 580px;
            }
            .anime-card {
                width: 190px;
            }
        }
        body.no-scroll {
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
    </style>
</head>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="social-icons">
            <a href="#" title="GitHub">📂</a>
            <a href="#" title="Twitter">🐦</a>
            <a href="#" title="Discord">💬</a>
        </div>
        <p>© 2026 StreamFlix. Built with ❤️ | Powered by Jikan API</p>
    </footer>

    <script>
        (function() {
            // ============ DOM REFS ============
            const $ = (s) => document.querySelector(s);
            const $$ = (s) => document.querySelectorAll(s);

            const header = $('#header');
            const hamburgerBtn = $('#hamburgerBtn');
            const sidebarOverlay = $('#sidebarOverlay');
            const mobileSidebar = $('#mobileSidebar');
            const searchBtn = $('#searchBtn');
            const searchOverlay = $('#searchOverlay');
            const searchInput = $('#searchInput');
            const searchResults = $('#searchResults');
            const searchClose = $('#searchClose');
            const heroTrack = $('#heroTrack');
            const heroDots = $('#heroDots');
            const heroSkeleton = $('#heroSkeleton');
            const heroPrev = $('#heroPrev');
            const heroNext = $('#heroNext');
            const heroSection = $('#heroSection');

            // ============ STATE ============
            let heroSlides = [];
            let heroIndex = 0;
            let heroInterval = null;
            let heroData = [];
            let searchDebounceTimer = null;
            let searchCache = new Map();

            // ============ HELPERS ============
            const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

            async function fetchWithRetry(url, retries = 3, timeoutMs = 8000) {
                for (let i = 0; i < retries; i++) {
                    try {
                        const controller = new AbortController();
                        const timer = setTimeout(() => controller.abort(), timeoutMs);
                        const res = await fetch(url, { signal: controller.signal });
                        clearTimeout(timer);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        return await res.json();
                    } catch (e) {
                        if (i === retries - 1) throw e;
                        await new Promise(r => setTimeout(r, 1000 * (i + 1)));
                    }
                }
            }

            function getCache(key) {
                try {
                    const item = localStorage.getItem('sf_' + key);
                    if (!item) return null;
                    const parsed = JSON.parse(item);
                    if (Date.now() - parsed.t > 3600000) { localStorage.removeItem('sf_' +
                            key);
                        return null; }
                    return parsed.d;
                } catch { return null; }
            }

            function setCache(key, data) {
                try { localStorage.setItem('sf_' + key, JSON.stringify({ d: data, t: Date.now() })); } catch {}
            }

            function createAnimeCard(anime) {
                const title = anime.title_english || anime.title || 'Unknown';
                const score = anime.score || (anime.statistics?.score) || 'N/A';
                const episodes = anime.episodes || '?';
                const type = anime.type || 'TV';
                const malId = anime.mal_id;
                const img = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url ||
                    'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 200" fill="%231a1a25"><rect width="150" height="200"/><text x="75" y="100" text-anchor="middle" fill="%23666" font-size="14">No Image</text></svg>';
                const scoreVal = typeof score === 'number' ? score.toFixed(1) : score;

                return `
                <a href="anime.html?id=${malId}" class="anime-card" title="${title.replace(/"/g,'&quot;')}">
                    <div class="card-img-wrap">
                        <img src="${img}" alt="${title}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 150 200%22 fill=%22%231a1a25%22><rect width=%22150%22 height=%22200%22/><text x=%2275%22 y=%22100%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2214%22>No Image</text></svg>'">
                        <div class="gradient-overlay"></div>
                        <div class="card-badges">
                            ${scoreVal !== 'N/A' ? `<span class="badge badge-score">⭐ ${scoreVal}</span>` : ''}
                            <span class="badge badge-ep">📺 ${episodes}</span>
                            <span class="badge badge-hd">HD</span>
                            <span class="badge badge-type">${type}</span>
                        </div>
                    </div>
                    <div class="card-info">
                        <div class="card-title">${title}</div>
                        <div class="card-meta">${type} · ${episodes} eps</div>
                    </div>
                </a>`;
            }

            function createSkeletonCards(count = 12) {
                let html = '';
                for (let i = 0; i < count; i++) {
                    html += '<div class="skeleton skeleton-card"></div>';
                }
                return html;
            }

            // ============ UNIVERSAL SLIDER SYSTEM ============
            function initSlider(wrapSelector) {
                const wrap = typeof wrapSelector === 'string' ? $(wrapSelector) : wrapSelector;
                if (!wrap) return;
                if (wrap.dataset.sliderInit === 'true') return;
                wrap.dataset.sliderInit = 'true';

                const track = wrap.querySelector('.slider-track');
                const prevBtn = wrap.querySelector('.slider-arrow.prev');
                const nextBtn = wrap.querySelector('.slider-arrow.next');
                if (!track) return;

                let isDown = false;
                let startX = 0;
                let scrollLeft = 0;
                let dragDist = 0;

                const scrollAmount = () => track.querySelector('.anime-card')?.offsetWidth * 3 || 400;

                function updateArrows() {
                    if (!prevBtn || !nextBtn) return;
                    const canScrollLeft = track.scrollLeft > 2;
                    const canScrollRight = track.scrollLeft + track.clientWidth < track.scrollWidth - 2;
                    prevBtn.style.opacity = canScrollLeft ? '1' : '0.4';
                    prevBtn.style.pointerEvents = canScrollLeft ? 'auto' : 'none';
                    nextBtn.style.opacity = canScrollRight ? '1' : '0.4';
                    nextBtn.style.pointerEvents = canScrollRight ? 'auto' : 'none';
                }

                if (prevBtn) {
                    prevBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        track.scrollBy({ left: -scrollAmount(), behavior: 'smooth' });
                    });
                }
                if (nextBtn) {
                    nextBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        track.scrollBy({ left: scrollAmount(), behavior: 'smooth' });
                    });
                }

                track.addEventListener('mousedown', (e) => {
                    isDown = true;
                    dragDist = 0;
                    track.classList.add('dragging');
                    startX = e.pageX - track.offsetLeft;
                    scrollLeft = track.scrollLeft;
                });
                track.addEventListener('mouseleave', () => {
                    if (isDown) { isDown = false;
                        track.classList.remove('dragging'); }
                });
                track.addEventListener('mouseup', () => { isDown = false;
                    track.classList.remove('dragging'); });
                track.addEventListener('mousemove', (e) => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - track.offsetLeft;
                    dragDist = Math.abs(x - startX);
                    track.scrollLeft = scrollLeft - (x - startX) * 1.5;
                });
                track.addEventListener('touchstart', (e) => {
                    isDown = true;
                    dragDist = 0;
                    startX = e.touches[0].pageX - track.offsetLeft;
                    scrollLeft = track.scrollLeft;
                }, { passive: true });
                track.addEventListener('touchend', () => { isDown = false; });
                track.addEventListener('touchmove', (e) => {
                    if (!isDown) return;
                    const x = e.touches[0].pageX - track.offsetLeft;
                    dragDist = Math.abs(x - startX);
                }, { passive: true });
                track.addEventListener('wheel', (e) => {
                    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
                    e.preventDefault();
                    track.scrollLeft += e.deltaY * 1.5;
                }, { passive: false });
                track.addEventListener('scroll', updateArrows, { passive: true });

                // Prevent card clicks after drag
                track.addEventListener('click', (e) => {
                    if (dragDist > 8) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                }, true);

                updateArrows();
                // Recheck on resize
                let resizeTimer;
                const resizeObs = new ResizeObserver(() => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(updateArrows, 150);
                });
                resizeObs.observe(track);
                wrap._resizeObs = resizeObs;
                wrap._track = track;
            }

            function populateSlider(sliderId, animeList) {
                const track = $('#' + sliderId);
                if (!track) return;
                if (!animeList || animeList.length === 0) {
                    track.innerHTML = '<div style="padding:20px;color:#6b6b80;white-space:nowrap;">No anime found</div>';
                    return;
                }
                track.innerHTML = animeList.map(a => createAnimeCard(a)).join('');
                const wrap = track.closest('.slider-wrap');
                if (wrap) {
                    wrap.dataset.sliderInit = 'false';
                    initSlider(wrap);
                }
            }

            // ============ HERO SLIDER ============
            function buildHeroSlides(data) {
                heroData = data.slice(0, 15);
                if (heroData.length < 5) {
                    heroData = [...heroData, ...data.slice(0, 15 - heroData.length)];
                }
                heroSlides = heroData;
                heroTrack.innerHTML = heroSlides.map((anime, i) => {
                    const title = anime.title_english || anime.title || 'Unknown';
                    const score = (anime.score || 0).toFixed(1);
                    const genres = (anime.genres || []).slice(0, 3).map(g => g.name).join(' · ');
                    const synopsis = (anime.synopsis || 'No synopsis available.').substring(0, 200) +
                        '...';
                    const banner = anime.images?.jpg?.large_image_url || anime.images?.jpg
                        ?.image_url || '';
                    const malId = anime.mal_id;
                    return `
                    <div class="hero-slide" data-index="${i}">
                        <img src="${banner}" alt="${title}" loading="${i<3?'eager':'lazy'}" onerror="this.style.display='none'">
                        <div class="hero-overlay"></div>
                        <div class="hero-content">
                            <div class="hero-title">${title}</div>
                            <div class="hero-meta">
                                <span class="hero-score">⭐ ${score}</span>
                                <span style="color:#ccc;">${anime.type || 'TV'}</span>
                            </div>
                            <div class="hero-genres"><span>${genres}</span></div>
                            <p class="hero-synopsis">${synopsis}</p>
                            <div class="hero-buttons">
                                <a href="watch.html?id=${malId}&ep=1" class="btn-watch">▶ Watch Now</a>
                                <a href="anime.html?id=${malId}" class="btn-details">ℹ Details</a>
                            </div>
                        </div>
                    </div>`;
                }).join('');
                heroDots.innerHTML = heroSlides.map((_, i) =>
                    `<button class="hero-dot${i===0?' active':''}" data-index="${i}" aria-label="Slide ${i+1}"></button>`
                ).join('');
                heroIndex = 0;
                updateHeroPosition();
                if (heroSkeleton) heroSkeleton.style.display = 'none';
                startHeroAutoplay();
            }

            function updateHeroPosition() {
                heroTrack.style.transform = `translateX(-${heroIndex * 100}%)`;
                const dots = heroDots.querySelectorAll('.hero-dot');
                dots.forEach((d, i) => d.classList.toggle('active', i === heroIndex));
            }

            function goToHeroSlide(idx) {
                heroIndex = clamp(idx, 0, heroSlides.length - 1);
                updateHeroPosition();
                resetHeroAutoplay();
            }

            function nextHeroSlide() {
                heroIndex = (heroIndex + 1) % heroSlides.length;
                updateHeroPosition();
            }

            function prevHeroSlide() {
                heroIndex = (heroIndex - 1 + heroSlides.length) % heroSlides.length;
                updateHeroPosition();
            }

            function startHeroAutoplay() {
                stopHeroAutoplay();
                heroInterval = setInterval(nextHeroSlide, 5000);
            }

            function stopHeroAutoplay() {
                if (heroInterval) clearInterval(heroInterval);
                heroInterval = null;
            }

            function resetHeroAutoplay() {
                stopHeroAutoplay();
                startHeroAutoplay();
            }

            // Hero event listeners
            heroPrev.addEventListener('click', () => { prevHeroSlide();
                resetHeroAutoplay(); });
            heroNext.addEventListener('click', () => { nextHeroSlide();
                resetHeroAutoplay(); });
            heroDots.addEventListener('click', (e) => {
                const dot = e.target.closest('.hero-dot');
                if (!dot) return;
                const idx = parseInt(dot.dataset.index);
                if (!isNaN(idx)) goToHeroSlide(idx);
            });
            // Touch swipe for hero
            let heroTouchStartX = 0;
            let heroTouchDist = 0;
            heroSection.addEventListener('touchstart', (e) => { heroTouchStartX = e.touches[0].clientX;
                heroTouchDist = 0;
                stopHeroAutoplay(); }, { passive: true });
            heroSection.addEventListener('touchmove', (e) => {
                heroTouchDist = Math.abs(e.touches[0].clientX - heroTouchStartX);
            }, { passive: true });
            heroSection.addEventListener('touchend', (e) => {
                if (heroTouchDist > 50) {
                    const diff = e.changedTouches[0].clientX - heroTouchStartX;
                    if (diff > 30) prevHeroSlide();
                    else if (diff < -30) nextHeroSlide();
                }
                startHeroAutoplay();
            });
            // Keyboard
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' && document.activeElement === document.body) prevHeroSlide
                ();
                if (e.key === 'ArrowRight' && document.activeElement === document.body) nextHeroSlide
                ();
            });

            // ============ LOAD ALL DATA ============
            async function loadHeroData() {
                const cacheKey = 'hero_trending';
                let data = getCache(cacheKey);
                if (!data) {
                    try {
                        const res = await fetchWithRetry(
                            'https://api.jikan.moe/v4/top/anime?filter=bypopularity&limit=15');
                        data = res.data || [];
                        if (data.length > 0) setCache(cacheKey, data);
                    } catch (e) {
                        console.warn('Hero fetch failed:', e);
                        data = [];
                    }
                }
                if (data.length === 0) {
                    // Fallback: try trending
                    try {
                        const res = await fetchWithRetry('https://api.jikan.moe/v4/seasons/now?limit=15');
                        data = res.data || [];
                    } catch { data = []; }
                }
                if (data.length > 0) {
                    buildHeroSlides(data);
                } else if (heroSkeleton) {
                    heroSkeleton.style.display = 'none';
                    heroTrack.innerHTML =
                        '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#6b6b80;font-size:18px;">Unable to load hero. Please refresh.</div>';
                }
            }

            async function loadWidget(sliderId, cacheKey, apiUrl, fallbackUrl) {
                const track = $('#' + sliderId);
                if (!track) return;
                track.innerHTML = createSkeletonCards(12);
                let data = getCache(cacheKey);
                if (!data) {
                    try {
                        const res = await fetchWithRetry(apiUrl);
                        data = res.data || [];
                        if (data.length > 0) setCache(cacheKey, data);
                    } catch {
                        if (fallbackUrl) {
                            try {
                                const res = await fetchWithRetry(fallbackUrl);
                                data = res.data || [];
                            } catch { data = []; }
                        } else { data = []; }
                    }
                }
                populateSlider(sliderId, data.slice(0, 20));
            }

            async function loadAllWidgets() {
                const widgets = [
                    { sliderId: 'sliderRecent', cacheKey: 'recent', apiUrl: 'https://api.jikan.moe/v4/seasons/now?limit=20',
                        fallbackUrl: 'https://api.jikan.moe/v4/top/anime?limit=20' },
                    { sliderId: 'sliderTrending', cacheKey: 'trending',
                        apiUrl: 'https://api.jikan.moe/v4/top/anime?filter=bypopularity&limit=20',
                        fallbackUrl: 'https://api.jikan.moe/v4/seasons/now?limit=20' },
                    { sliderId: 'sliderTopRated', cacheKey: 'toprated', apiUrl: 'https://api.jikan.moe/v4/top/anime?limit=20',
                        fallbackUrl: 'https://api.jikan.moe/v4/top/anime?filter=bypopularity&limit=20' },
                    { sliderId: 'sliderAiring', cacheKey: 'airing', apiUrl: 'https://api.jikan.moe/v4/top/anime?filter=airing&limit=20',
                        fallbackUrl: 'https://api.jikan.moe/v4/seasons/now?limit=20' },
                    { sliderId: 'sliderUpcoming', cacheKey: 'upcoming', apiUrl: 'https://api.jikan.moe/v4/seasons/upcoming?limit=20',
                        fallbackUrl: 'https://api.jikan.moe/v4/top/anime?limit=20' },
                    { sliderId: 'sliderCompleted', cacheKey: 'completed',
                        apiUrl: 'https://api.jikan.moe/v4/top/anime?filter=bypopularity&limit=20',
                        fallbackUrl: 'https://api.jikan.moe/v4/seasons/now?limit=20' },
                ];

                const results = await Promise.allSettled(widgets.map(w => loadWidget(w.sliderId, w.cacheKey,
                    w.apiUrl, w.fallbackUrl)));
                results.forEach((r, i) => {
                    if (r.status === 'rejected') {
                        console.warn(`Widget ${widgets[i].sliderId} failed:`, r.reason);
                        populateSlider(widgets[i].sliderId, []);
                    }
                });
            }

            // ============ SEARCH OVERLAY ============
            function openSearch() {
                searchOverlay.classList.add('open');
                document.body.classList.add('no-scroll');
                searchInput.focus();
                searchResults.innerHTML = '<div class="search-no-results">Start typing to search anime...</div>';
            }

            function closeSearch() {
                searchOverlay.classList.remove('open');
                document.body.classList.remove('no-scroll');
                searchInput.value = '';
                searchResults.innerHTML = '<div class="search-no-results">Start typing to search anime...</div>';
            }

            async function performSearch(query) {
                if (!query || query.trim().length < 2) {
                    searchResults.innerHTML =
                        '<div class="search-no-results">Type at least 2 characters...</div>';
                    return;
                }
                const q = query.trim().toLowerCase();
                if (searchCache.has(q)) {
                    renderSearchResults(searchCache.get(q));
                    return;
                }
                searchResults.innerHTML = '<div class="search-loading">Searching...</div>';
                try {
                    const res = await fetchWithRetry(
                        `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(q)}&limit=12&sfw=true`, 2,
                        6000);
                    const data = res.data || [];
                    searchCache.set(q, data);
                    renderSearchResults(data);
                } catch {
                    searchResults.innerHTML =
                        '<div class="search-no-results">Search failed. Please try again.</div>';
                }
            }

            function renderSearchResults(data) {
                if (!data || data.length === 0) {
                    searchResults.innerHTML = '<div class="search-no-results">No results found</div>';
                    return;
                }
                searchResults.innerHTML = data.map(anime => {
                    const title = anime.title_english || anime.title || 'Unknown';
                    const img = anime.images?.jpg?.image_url || '';
                    const score = anime.score ? anime.score.toFixed(1) : 'N/A';
                    const type = anime.type || 'TV';
                    return `
                    <a href="anime.html?id=${anime.mal_id}" class="search-result-item">
                        <img src="${img}" alt="${title}" loading="lazy" onerror="this.style.display='none'">
                        <div class="search-result-info">
                            <div class="title">${title}</div>
                            <div class="meta">⭐ ${score} · ${type} · ${anime.episodes || '?'} eps</div>
                        </div>
                    </a>`;
                }).join('');
            }

            searchBtn.addEventListener('click', (e) => {
                e.preventDefault();
                openSearch();
            });
            searchClose.addEventListener('click', closeSearch);
            searchOverlay.addEventListener('click', (e) => {
                if (e.target === searchOverlay) closeSearch();
            });
            searchInput.addEventListener('input', () => {
                clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(() => performSearch(searchInput.value), 300);
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && searchOverlay.classList.contains('open')) {
                    closeSearch();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    openSearch();
                }
            });

            // ============ MOBILE SIDEBAR ============
            function openSidebar() {
                mobileSidebar.classList.add('open');
                sidebarOverlay.classList.add('open');
                document.body.classList.add('no-scroll');
            }

            function closeSidebar() {
                mobileSidebar.classList.remove('open');
                sidebarOverlay.classList.remove('open');
                document.body.classList.remove('no-scroll');
            }
            hamburgerBtn.addEventListener('click', openSidebar);
            sidebarOverlay.addEventListener('click', closeSidebar);
            mobileSidebar.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => setTimeout(closeSidebar, 200));
            });

            // ============ HEADER SCROLL ============
            window.addEventListener('scroll', () => {
                header.classList.toggle('scrolled', window.scrollY > 10);
            }, { passive: true });

            // ============ INIT ============
            async function init() {
                // Load hero first
                await loadHeroData();
                // Then load all widgets
                await loadAllWidgets();
                // Init all sliders (some may have been init during populate)
                document.querySelectorAll('.slider-wrap').forEach(w => initSlider(w));
            }

            // Start
            init().catch(err => {
                console.error('Init error:', err);
                if (heroSkeleton) heroSkeleton.style.display = 'none';
            });

            // Handle orientation changes
            window.addEventListener('orientationchange', () => {
                setTimeout(() => {
                    updateHeroPosition();
                    document.querySelectorAll('.slider-wrap').forEach(w => {
                        const track = w.querySelector('.slider-track');
                        if (track && w._track) {
                            w.dataset.sliderInit = 'false';
                            initSlider(w);
                        }
                    });
                }, 400);
            });

            // Clean up on page unload
            window.addEventListener('beforeunload', () => {
                stopHeroAutoplay();
                document.querySelectorAll('.slider-wrap').forEach(w => {
                    if (w._resizeObs) w._resizeObs.disconnect();
                });
            });

            console.log('🚀 StreamFlix Home initialized successfully');
        })();
    </script>
</body>
</html>
