<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Watch anime online free in HD quality. Stream trending, top rated, airing and upcoming anime.">
  <meta property="og:title" content="NekoStream - Watch Anime Free">
  <meta property="og:description" content="Stream thousands of anime episodes in HD with no ads.">
  <meta property="og:type" content="website">
  <title>NekoStream - Watch Anime Free</title>
  <style>
    :root {
      --bg: #050505;
      --surface: rgba(15,15,15,0.85);
      --primary: #a855f7;
      --primary-dark: #7e22ce;
      --primary-glow: rgba(168,85,247,0.35);
      --text: #f5f5f5;
      --text-secondary: #a1a1aa;
      --radius: 16px;
      --header-height: 64px;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { overflow-x:hidden; max-width:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; line-height:1.5; min-height:100dvh; }

    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--primary); border-radius:3px; }

    /* Header */
    .header {
      position:fixed; top:0; left:0; right:0; height:calc(var(--header-height) + var(--safe-top));
      padding-top:var(--safe-top); background:rgba(5,5,5,0.92); backdrop-filter:blur(20px) saturate(1.2);
      border-bottom:1px solid rgba(255,255,255,0.06); z-index:1000; display:flex; align-items:center;
      justify-content:space-between; padding-left:clamp(12px,3vw,32px); padding-right:clamp(12px,3vw,32px); max-width:100vw;
    }
    .header-left, .header-right { display:flex; align-items:center; gap:12px; flex-shrink:0; min-width:0; }
    .logo { font-size:clamp(1.1rem,3vw,1.5rem); font-weight:800; background:linear-gradient(135deg,var(--primary),#c084fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:-0.5px; white-space:nowrap; text-decoration:none; }
    .menu-btn, .search-btn {
      width:40px; height:40px; border-radius:10px; border:none; background:rgba(255,255,255,0.08);
      color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:all 0.2s; flex-shrink:0; touch-action:manipulation;
    }
    .menu-btn:hover, .search-btn:hover { background:var(--primary); }
    .menu-btn svg, .search-btn svg { width:20px; height:20px; }

    /* Mobile Nav */
    .mobile-nav {
      position:fixed; top:0; left:0; bottom:0; width:min(280px,80vw);
      background:rgba(8,8,8,0.98); backdrop-filter:blur(30px); z-index:1001;
      transform:translateX(-100%); transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
      border-right:1px solid rgba(255,255,255,0.06); overflow-y:auto; padding:28px 24px;
    }
    .mobile-nav.open { transform:translateX(0); }
    .mobile-nav-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:1000; opacity:0; pointer-events:none; transition:opacity 0.3s; }
    .mobile-nav-overlay.open { opacity:1; pointer-events:auto; }
    .nav-link { display:block; padding:14px 0; color:var(--text-secondary); text-decoration:none; font-weight:500; border-bottom:1px solid rgba(255,255,255,0.05); transition:color 0.2s; font-size:1rem; }
    .nav-link:hover { color:var(--primary); }

    /* Search Overlay */
    .search-overlay {
      position:fixed; inset:0; background:rgba(5,5,5,0.98); backdrop-filter:blur(40px) saturate(1.2);
      z-index:999; display:flex; flex-direction:column; align-items:center;
      padding:calc(var(--header-height) + 24px) clamp(12px,3vw,32px) 24px; opacity:0; pointer-events:none;
      transition:opacity 0.3s ease; max-width:100vw; overflow-x:hidden;
    }
    .search-overlay.open { opacity:1; pointer-events:auto; }
    .search-container { width:100%; max-width:800px; position:relative; }
    .search-input {
      width:100%; padding:16px 52px 16px 20px; font-size:clamp(1rem,2.5vw,1.25rem);
      border:2px solid rgba(255,255,255,0.1); border-radius:var(--radius); background:rgba(255,255,255,0.05);
      color:var(--text); outline:none; transition:all 0.3s; -webkit-appearance:none;
    }
    .search-input:focus { border-color:var(--primary); background:rgba(255,255,255,0.08); box-shadow:0 0 20px var(--primary-glow); }
    .search-close { position:absolute; right:12px; top:50%; transform:translateY(-50%);
      width:36px; height:36px; border-radius:50%; border:none; background:rgba(255,255,255,0.1);
      color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; touch-action:manipulation;
    }
    .search-results { width:100%; max-width:800px; margin-top:16px; max-height:calc(100dvh - 200px); overflow-y:auto; overflow-x:hidden; padding-bottom:var(--safe-bottom); }
    .search-suggestion { display:flex; align-items:center; gap:12px; padding:10px; border-radius:10px; cursor:pointer; transition:background 0.2s; text-decoration:none; color:var(--text); max-width:100%; }
    .search-suggestion:hover { background:rgba(255,255,255,0.05); }
    .search-suggestion img { width:48px; height:64px; object-fit:cover; border-radius:8px; flex-shrink:0; }
    .search-suggestion .sugg-info { min-width:0; flex:1; }
    .search-suggestion .sugg-title { font-weight:600; font-size:0.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
    .search-suggestion .sugg-meta { font-size:0.8rem; color:var(--text-secondary); }

    /* Hero */
    .hero { position:relative; width:100%; height:100dvh; min-height:500px; overflow:hidden; margin-top:var(--header-height); }
    .hero-slide { position:absolute; inset:0; opacity:0; transition:opacity 0.9s ease; pointer-events:none; }
    .hero-slide.active { opacity:1; pointer-events:auto; }
    .hero-bg { position:absolute; inset:0; background-size:cover; background-position:center 20%; }
    .hero-bg::after { content:''; position:absolute; inset:0; background:linear-gradient(to top,var(--bg) 0%, rgba(5,5,5,0.7) 40%, rgba(5,5,5,0.3) 100%); }
    .hero-content { position:absolute; bottom:0; left:0; right:0; padding:clamp(24px,4vw,60px) clamp(12px,3vw,48px) clamp(40px,6vw,100px); z-index:2; max-width:100%; }
    .hero-title { font-size:clamp(1.6rem,4.5vw,3.2rem); font-weight:800; margin-bottom:12px; line-height:1.1; max-width:900px; text-shadow:0 2px 20px rgba(0,0,0,0.5); }
    .hero-meta { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; font-size:0.9rem; color:var(--text-secondary); }
    .hero-score { background:rgba(255,255,255,0.12); padding:4px 10px; border-radius:20px; font-weight:700; color:#fbbf24; }
    .hero-genres { display:flex; flex-wrap:wrap; gap:6px; }
    .hero-genre { background:rgba(168,85,247,0.25); color:var(--primary); padding:4px 12px; border-radius:20px; font-size:0.78rem; font-weight:600; border:1px solid rgba(168,85,247,0.3); }
    .hero-synopsis { font-size:clamp(0.88rem,1.4vw,1.05rem); color:var(--text-secondary); max-width:650px; margin-bottom:24px; line-height:1.6; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .hero-buttons { display:flex; flex-wrap:wrap; gap:12px; }
    .btn { padding:12px 22px; border-radius:12px; font-weight:700; font-size:0.92rem; cursor:pointer; border:none; text-decoration:none; display:inline-flex; align-items:center; gap:8px; transition:all 0.3s; touch-action:manipulation; }
    .btn-primary { background:var(--primary); color:white; box-shadow:0 4px 20px var(--primary-glow); }
    .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 30px var(--primary-glow); }
    .btn-secondary { background:rgba(255,255,255,0.1); color:var(--text); border:1px solid rgba(255,255,255,0.12); }
    .btn-secondary:hover { background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.2); }

    .hero-dots { position:absolute; bottom:clamp(16px,3vw,32px); left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:3; }
    .hero-dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.3); cursor:pointer; transition:all 0.3s; border:none; padding:0; }
    .hero-dot.active { width:24px; border-radius:4px; background:var(--primary); }
    .hero-arrows { position:absolute; top:50%; transform:translateY(-50%); z-index:3; width:100%; display:flex; justify-content:space-between; padding:0 clamp(8px,2vw,24px); pointer-events:none; }
    .hero-arrow { width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.1); backdrop-filter:blur(10px); border:none; color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.3s; pointer-events:auto; font-size:1.2rem; touch-action:manipulation; }
    .hero-arrow:hover { background:var(--primary); }

    /* Widgets */
    .section { padding:clamp(28px,4vw,60px) clamp(12px,3vw,48px); max-width:100vw; overflow-x:hidden; }
    .section-title { font-size:clamp(1.1rem,2.5vw,1.4rem); font-weight:700; margin-bottom:18px; display:flex; align-items:center; gap:10px; }
    .section-title::before { content:''; width:4px; height:22px; background:var(--primary); border-radius:2px; }

    .slider-wrapper { position:relative; width:100%; }
    .slider-container { display:flex; gap:14px; overflow-x:auto; scroll-behavior:smooth; scroll-snap-type:x mandatory; padding-bottom:12px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    .slider-container::-webkit-scrollbar { display:none; }
    .slider-arrow { position:absolute; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.1); backdrop-filter:blur(10px); border:none; color:var(--text); cursor:pointer; z-index:2; display:flex; align-items:center; justify-content:center; transition:all 0.3s; font-size:1.1rem; touch-action:manipulation; }
    .slider-arrow:hover { background:var(--primary); }
    .slider-arrow.prev { left:-8px; }
    .slider-arrow.next { right:-8px; }
    .slider-arrow.hidden { opacity:0; pointer-events:none; }

    /* Cards */
    .anime-card { flex:0 0 auto; width:clamp(130px,28vw,190px); scroll-snap-align:start; position:relative; border-radius:var(--radius); overflow:hidden; background:var(--surface); cursor:pointer; transition:transform 0.35s cubic-bezier(0.4,0,0.2,1), box-shadow 0.35s; text-decoration:none; color:var(--text); }
    .anime-card:hover { transform:translateY(-6px); box-shadow:0 16px 48px rgba(0,0,0,0.6), 0 0 24px var(--primary-glow); }
    .anime-card .card-img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; background:rgba(255,255,255,0.03); }
    .anime-card .card-overlay { position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.3) 50%, transparent 100%); }
    .anime-card .card-badges { position:absolute; top:8px; left:8px; display:flex; flex-wrap:wrap; gap:4px; max-width:calc(100% - 16px); }
    .badge { padding:3px 7px; border-radius:6px; font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.3px; }
    .badge-hd { background:rgba(168,85,247,0.9); color:white; }
    .badge-score { background:rgba(251,191,36,0.9); color:#111; }
    .badge-ep { background:rgba(34,197,94,0.9); color:white; }
    .badge-type { background:rgba(59,130,246,0.9); color:white; }
    .anime-card .card-info { position:absolute; bottom:0; left:0; right:0; padding:12px; }
    .anime-card .card-title { font-size:0.88rem; font-weight:700; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .anime-card .card-meta { font-size:0.72rem; color:var(--text-secondary); margin-top:4px; display:flex; gap:6px; flex-wrap:wrap; }

    /* Skeleton */
    .skeleton { background:linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.04) 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:var(--radius); }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .skeleton-card { width:clamp(130px,28vw,190px); flex:0 0 auto; aspect-ratio:3/4; }

    /* Footer */
    .footer { padding:40px clamp(12px,3vw,48px); text-align:center; border-top:1px solid rgba(255,255,255,0.05); margin-top:40px; }
    .footer-text { color:var(--text-secondary); font-size:0.85rem; }
    .footer-socials { display:flex; justify-content:center; gap:18px; margin-top:16px; }
    .footer-socials a { color:var(--text-secondary); text-decoration:none; font-size:0.85rem; transition:color 0.3s; }
    .footer-socials a:hover { color:var(--primary); }

    /* Responsive */
    @media (min-width: 768px) {
      .slider-arrow.prev { left:-16px; }
      .slider-arrow.next { right:-16px; }
    }
    @media (max-width: 480px) {
      .hero-arrows { display:none; }
      .hero-title { -webkit-line-clamp:2; display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden; }
    }
    @media (hover: none) {
      .anime-card:hover { transform:none; }
    }
  </style>
</head>

      <button class="menu-btn" id="menuBtn" aria-label="Menu">

  <nav class="mobile-nav" id="mobileNav" aria-hidden="true">

  </nav>
  <div class="mobile-nav-overlay" id="navOverlay"></div>

  <div class="search-overlay" id="searchOverlay">

  <section class="section" id="widget-recent">

  <section class="section" id="widget-trending">
    <h2 class="section-title">Trending Now</h2>
    <div class="slider-wrapper">
      <button class="slider-arrow prev hidden" aria-label="Previous">‹</button>
      <div class="slider-container" id="slider-trending"></div>
      <button class="slider-arrow next" aria-label="Next">›</button>
    </div>
  </section>

  <section class="section" id="widget-top">
    <h2 class="section-title">Top Rated</h2>
    <div class="slider-wrapper">
      <button class="slider-arrow prev hidden" aria-label="Previous">‹</button>
      <div class="slider-container" id="slider-top"></div>
      <button class="slider-arrow next" aria-label="Next">›</button>

  <section class="section" id="widget-airing">
    <h2 class="section-title">Top Airing</h2>
    <div class="slider-wrapper">
      <button class="slider-arrow prev hidden" aria-label="Previous">‹</button>
      <div class="slider-container" id="slider-airing"></div>

    <h2 class="section-title">Upcoming</h2>
    <div class="slider-wrapper">
      <button class="slider-arrow prev hidden" aria-label="Previous">‹</button>

      <button class="slider-arrow prev hidden" aria-label="Previous">‹</button>
      <div class="slider-container" id="slider-completed"></div>
      <button class="slider-arrow next" aria-label="Next">›</button>
    </div>

  <footer class="footer">
    <p class="footer-text">© 2025 NekoStream. All rights reserved.</p>
    <div class="footer-socials">
      <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
      <a href="https://twitter.com" target="_blank" rel="noopener">Twitter</a>
    </div>
  </footer>

  <script>
    (function(){
      'use strict';

      const API_BASE = 'https://api.jikan.moe/v4';
      const CACHE_TTL = 6 * 60 * 1000;

      // Utility: robust fetch with cache, retry, timeout
      async function apiFetch(endpoint, retries = 3) {
        const key = 'nekocache_' + endpoint;
        const raw = localStorage.getItem(key);
        if (raw) {
          try { const c = JSON.parse(raw); if (Date.now() - c.t < CACHE_TTL) return c.d; } catch(e){}
        }
        for (let i = 0; i < retries; i++) {
          try {
            const ctrl = new AbortController();
            const to = setTimeout(() => ctrl.abort(), 10000);
            const res = await fetch(API_BASE + endpoint, { signal: ctrl.signal });
            clearTimeout(to);
            if (!res.ok) {
              if (res.status === 429) { await sleep(1200); continue; }
              throw new Error('HTTP ' + res.status);
            }
            const json = await res.json();
            const data = json.data || json;
            try { localStorage.setItem(key, JSON.stringify({ d: data, t: Date.now() })); } catch(e){}
            return data;
          } catch (e) {
            if (i === retries - 1) return null;
            await sleep(500 * (i + 1));
          }
        }
        return null;
      }
      function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

      // Mobile Nav
      const menuBtn = document.getElementById('menuBtn');
      const mobileNav = document.getElementById('mobileNav');
      const navOverlay = document.getElementById('navOverlay');
      function toggleNav(show){
        mobileNav.classList.toggle('open', show);
        navOverlay.classList.toggle('open', show);
        mobileNav.setAttribute('aria-hidden', !show);
      }
      menuBtn?.addEventListener('click', () => toggleNav(!mobileNav.classList.contains('open')));
      navOverlay?.addEventListener('click', () => toggleNav(false));

      // Search Overlay
      const searchOverlay = document.getElementById('searchOverlay');
      const searchInput = document.getElementById('searchInput');
      const searchResults = document.getElementById('searchResults');
      const searchBtn = document.getElementById('searchBtn');
      const searchClose = document.getElementById('searchClose');
      let searchTimer;

      function openSearch(){ searchOverlay.classList.add('open'); document.body.style.overflow='hidden'; searchInput.focus(); }
      function closeSearch(){ searchOverlay.classList.remove('open'); document.body.style.overflow=''; searchInput.value=''; searchResults.innerHTML=''; }
      searchBtn?.addEventListener('click', openSearch);
      searchClose?.addEventListener('click', closeSearch);
      searchOverlay?.addEventListener('click', e => { if(e.target === searchOverlay) closeSearch(); });
      document.addEventListener('keydown', e => { if(e.key==='Escape') closeSearch(); });

      searchInput?.addEventListener('input', e => {
        clearTimeout(searchTimer);
        const q = e.target.value.trim();
        if(!q){ searchResults.innerHTML=''; return; }
        searchTimer = setTimeout(async () => {
          const data = await apiFetch('/anime?q='+encodeURIComponent(q)+'&limit=8&order_by=members&sort=desc');
          if(!data || !data.length){
            searchResults.innerHTML = '<div style="color:var(--text-secondary);padding:20px;text-align:center;">No results found</div>';
            return;
          }
          searchResults.innerHTML = data.map(a => `
            <a href="anime.html?id=${a.mal_id}" class="search-suggestion">
              <img src="${a.images?.jpg?.image_url || ''}" alt="" loading="lazy">
              <div class="sugg-info">
                <span class="sugg-title">${escapeHtml(a.title_english || a.title)}</span>
                <span class="sugg-meta">${a.type||'TV'} • ${a.score?'★ '+a.score:'N/A'}</span>
              </div>
            </a>
          `).join('');
        }, 350);
      });

      function escapeHtml(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

      // Hero Slider
      class HeroSlider {
        constructor(){
          this.el = document.getElementById('hero');
          this.slides = [];
          this.current = 0;
          this.autoTimer = null;
          this.touchStartX = 0;
          this.isDragging = false;
        }
        async init(){
          const data = await apiFetch('/top/anime?limit=12');
          if(!data || !data.length){ this.renderFallback(); return; }
          this.slides = data.slice(0,10);
          this.render();
          this.bindEvents();
          this.startAuto();
        }
        render(){
          this.el.innerHTML = this.slides.map((anime,i) => `
            <div class="hero-slide ${i===0?'active':''}" data-index="${i}">
              <div class="hero-bg" style="background-image:url('${anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || ''}')"></div>
              <div class="hero-content">
                <h1 class="hero-title">${escapeHtml(anime.title_english || anime.title)}</h1>
                <div class="hero-meta">
                  <span class="hero-score">★ ${anime.score||'N/A'}</span>
                  <div class="hero-genres">${(anime.genres||[]).slice(0,3).map(g=>`<span class="hero-genre">${escapeHtml(g.name)}</span>`).join('')}</div>
                </div>
                <p class="hero-synopsis">${escapeHtml(anime.synopsis || 'No synopsis available.')}</p>
                <div class="hero-buttons">
                  <a href="watch.html?id=${anime.mal_id}&ep=1" class="btn btn-primary">▶ Watch Now</a>
                  <a href="anime.html?id=${anime.mal_id}" class="btn btn-secondary">Details</a>
                </div>
              </div>
            </div>
          `).join('') + `
            <div class="hero-dots">${this.slides.map((_,i)=>`<button class="hero-dot ${i===0?'active':''}" data-index="${i}" aria-label="Slide ${i+1}"></button>`).join('')}</div>
            <div class="hero-arrows">
              <button class="hero-arrow prev" aria-label="Previous slide">‹</button>
              <button class="hero-arrow next" aria-label="Next slide">›</button>
            </div>
          `;
        }
        renderFallback(){
          this.el.innerHTML = `
            <div class="hero-slide active">
              <div class="hero-bg" style="background:linear-gradient(135deg,#1a0b2e,#0f0518);"></div>
              <div class="hero-content">
                <h1 class="hero-title">Welcome to NekoStream</h1>
                <p class="hero-synopsis">Stream thousands of anime episodes in HD. Discover trending, top rated, and classic series.</p>
                <div class="hero-buttons"><a href="search.html" class="btn btn-primary">Browse Anime</a></div>
              </div>
            </div>`;
        }
        goTo(index){
          if(!this.slides.length) return;
          const slides = this.el.querySelectorAll('.hero-slide');
          const dots = this.el.querySelectorAll('.hero-dot');
          slides[this.current]?.classList.remove('active');
          dots[this.current]?.classList.remove('active');
          this.current = (index + this.slides.length) % this.slides.length;
          slides[this.current]?.classList.add('active');
          dots[this.current]?.classList.add('active');
        }
        startAuto(){ if(this.autoTimer) clearInterval(this.autoTimer); this.autoTimer = setInterval(()=>this.goTo(this.current+1), 7000); }
        bindEvents(){
          this.el.querySelector('.hero-arrow.prev')?.addEventListener('click', ()=>{ this.goTo(this.current-1); this.startAuto(); });
          this.el.querySelector('.hero-arrow.next')?.addEventListener('click', ()=>{ this.goTo(this.current+1); this.startAuto(); });
          this.el.querySelectorAll('.hero-dot').forEach((d,i)=> d.addEventListener('click',()=>{ this.goTo(i); this.startAuto(); }));
          // Touch swipe
          this.el.addEventListener('touchstart', e=>{ this.touchStartX=e.touches[0].clientX; this.isDragging=true; },{passive:true});
          this.el.addEventListener('touchend', e=>{
            if(!this.isDragging) return;
            const diff = this.touchStartX - e.changedTouches[0].clientX;
            if(Math.abs(diff)>50){ this.goTo(this.current + (diff>0?1:-1)); this.startAuto(); }
            this.isDragging=false;
          },{passive:true});
          // Mouse drag
          this.el.addEventListener('mousedown', e=>{ this.touchStartX=e.clientX; this.isDragging=true; });
          this.el.addEventListener('mouseup', e=>{
            if(!this.isDragging) return;
            const diff = this.touchStartX - e.clientX;
            if(Math.abs(diff)>50){ this.goTo(this.current + (diff>0?1:-1)); this.startAuto(); }
            this.isDragging=false;
          });
        }
      }

      // Universal Widget Slider
      class WidgetSlider {
        constructor(container){
          this.container = typeof container==='string' ? document.getElementById(container) : container;
          if(!this.container) return;
          this.wrapper = this.container.closest('.slider-wrapper');
          this.prev = this.wrapper?.querySelector('.slider-arrow.prev');
          this.next = this.wrapper?.querySelector('.slider-arrow.next');
          this.init();
        }
        init(){
          const update = () => {
            const max = this.container.scrollWidth - this.container.clientWidth;
            this.prev?.classList.toggle('hidden', this.container.scrollLeft <= 5);
            this.next?.classList.toggle('hidden', this.container.scrollLeft >= max - 5);
          };
          this.prev?.addEventListener('click', ()=> this.container.scrollBy({ left: -this.container.clientWidth*0.75, behavior:'smooth' }));
          this.next?.addEventListener('click', ()=> this.container.scrollBy({ left: this.container.clientWidth*0.75, behavior:'smooth' }));
          this.container.addEventListener('scroll', update, {passive:true});
          // Horizontal wheel
          this.container.addEventListener('wheel', e=>{
            if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){
              e.preventDefault();
              this.container.scrollLeft += e.deltaY;
            }
          }, {passive:false});
          update();
          if(typeof ResizeObserver !== 'undefined'){
            new ResizeObserver(()=>update()).observe(this.container);
          }
          window.addEventListener('orientationchange', ()=> setTimeout(update, 300));
        }
      }

      // Load Widget
      async function loadWidget(sectionId, endpoint, title){
        const section = document.getElementById(sectionId);
        if(!section) return;
        const container = section.querySelector('.slider-container');
        // Skeleton
        container.innerHTML = Array(6).fill('<div class="skeleton skeleton-card"></div>').join('');
        const data = await apiFetch(endpoint);
        if(!data || !data.length){ section.style.display='none'; return; }
        container.innerHTML = data.slice(0,12).map(anime => `
          <a href="anime.html?id=${anime.mal_id}" class="anime-card">
            <img class="card-img" loading="lazy" src="${anime.images?.jpg?.image_url || ''}" alt="${escapeHtml(anime.title_english || anime.title)}">
            <div class="card-overlay"></div>
            <div class="card-badges">
              <span class="badge badge-hd">HD</span>
              ${anime.score?`<span class="badge badge-score">★ ${anime.score}</span>`:''}
              ${anime.episodes?`<span class="badge badge-ep">${anime.episodes} EP</span>`:''}
              <span class="badge badge-type">${anime.type || 'TV'}</span>
            </div>
            <div class="card-info">
              <div class="card-title">${escapeHtml(anime.title_english || anime.title)}</div>
              <div class="card-meta">${anime.aired?.string || ''}</div>
            </div>
          </a>
        `).join('');
        new WidgetSlider(container);
      }

      // Init
      document.addEventListener('DOMContentLoaded', () => {
        const hero = new HeroSlider();
        hero.init();

        const widgets = [
          { id:'widget-recent', url:'/seasons/now?limit=12' },
          { id:'widget-trending', url:'/top/anime?filter=airing&limit=12' },
          { id:'widget-top', url:'/top/anime?limit=12' },
          { id:'widget-airing', url:'/top/anime?filter=airing&limit=12' },
          { id:'widget-upcoming', url:'/top/anime?filter=upcoming&limit=12' },
          { id:'widget-completed', url:'/anime?status=complete&order_by=score&sort=desc&limit=12' }
        ];
        widgets.forEach((w,i)=> setTimeout(()=> loadWidget(w.id, w.url), i*400));
      });
    })();
  </script>
