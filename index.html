<style>
/* ==================== RESET & SAFETY ==================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-x: hidden; max-width: 100%; min-height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: #0a0a0f; color: #f1f1f1; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; background: none; border: none; }
img { max-width: 100%; height: auto; display: block; }
ul { list-style: none; }

/* ==================== VARIABLES ==================== */
:root {
  --bg: #0a0a0f; --surface: #12121a; --surface-2: #1a1a25;
  --primary: #8b5cf6; --primary-glow: rgba(139,92,246,0.35); --accent: #c084fc;
  --text: #f1f1f1; --text-2: #a1a1aa; --text-3: #71717a;
  --success: #22c55e; --glass: rgba(18,18,26,0.75); --glass-border: rgba(255,255,255,0.08);
  --radius: 12px; --radius-sm: 8px; --radius-lg: 16px;
  --header-height: 64px; --gap: 16px;
  --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
}

/* ==================== UTILITIES ==================== */
.glass { background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); }
.container { width: 100%; max-width: 1600px; margin: 0 auto; padding: 0 clamp(1rem, 3vw, 2rem); }
.section-title { font-size: clamp(1.1rem, 2vw, 1.5rem); font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
.section-title::before { content: ''; display: block; width: 4px; height: 1.2em; background: var(--primary); border-radius: 2px; box-shadow: 0 0 8px var(--primary); }

/* ==================== HEADER ==================== */
.header {
  position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); z-index: 900;
  background: rgba(10,10,15,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--glass-border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 clamp(0.75rem, 2vw, 2rem); max-width: 100vw;
}
.header-left, .header-right { display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; min-width: 0; }
.header-center {
  position: absolute; left: 50%; transform: translateX(-50%);
  font-size: clamp(1.1rem, 2vw, 1.5rem); font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
  white-space: nowrap; color: var(--text); pointer-events: none;
}
.logo-accent { color: var(--primary); text-shadow: 0 0 12px var(--primary-glow); }
.icon-btn {
  width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; color: var(--text); border-radius: var(--radius-sm);
  transition: background var(--transition), color var(--transition); -webkit-tap-highlight-color: transparent; flex-shrink: 0;
}
.icon-btn:hover { background: var(--surface-2); color: var(--primary); }
@media (max-width: 480px) { .icon-btn { width: 36px; height: 36px; } .header-center { font-size: 1rem; letter-spacing: 0.08em; } }

/* ==================== SIDEBAR ==================== */
.sidebar-overlay {
  position: fixed; inset: 0; z-index: 1099; background: rgba(0,0,0,0.6);
  opacity: 0; pointer-events: none; transition: opacity var(--transition);
}
.sidebar-overlay.active { opacity: 1; pointer-events: auto; }
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: min(300px, 85vw);
  background: var(--surface); z-index: 1100; transform: translateX(-100%);
  transition: transform var(--transition); border-right: 1px solid var(--glass-border);
  padding: 1.5rem; overflow-y: auto;
}
.sidebar.active { transform: translateX(0); }
.sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
.sidebar-title { font-size: 1.25rem; font-weight: 700; }
.sidebar-nav a {
  display: block; padding: 0.875rem 1rem; border-radius: var(--radius-sm); color: var(--text-2);
  font-weight: 500; transition: background var(--transition), color var(--transition); margin-bottom: 0.25rem;
}
.sidebar-nav a:hover, .sidebar-nav a.active { background: rgba(139,92,246,0.15); color: var(--primary); }

/* ==================== SEARCH OVERLAY ==================== */
.search-overlay {
  position: fixed; inset: 0; z-index: 1000; background: rgba(10,10,15,0.97);
  backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  display: flex; flex-direction: column; opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
  padding: calc(var(--header-height) + 1rem) clamp(1rem, 3vw, 3rem) 2rem;
  max-width: 100vw; overflow-x: hidden;
}
.search-overlay.active { opacity: 1; pointer-events: auto; }
.search-top {
  width: 100%; max-width: 900px; margin: 0 auto 1.5rem;
  display: flex; align-items: center; gap: 0.75rem;
}
.search-input-wrap { flex: 1; position: relative; min-width: 0; }
.search-input-wrap svg {
  position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
  color: var(--text-3); pointer-events: none;
}
.search-input {
  width: 100%; padding: 0.875rem 1rem 0.875rem 2.75rem;
  font-size: clamp(1rem, 2vw, 1.25rem); background: var(--surface);
  border: 2px solid var(--glass-border); border-radius: var(--radius-lg);
  color: var(--text); outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }
.search-close-btn {
  width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
  background: var(--surface-2); border: none; color: var(--text); border-radius: 50%;
  flex-shrink: 0; transition: background var(--transition);
}
.search-close-btn:hover { background: var(--primary); color: white; }
.search-results {
  flex: 1; overflow-y: auto; overflow-x: hidden; width: 100%; max-width: 900px;
  margin: 0 auto; -webkit-overflow-scrolling: touch;
}
.search-loading, .search-empty { text-align: center; color: var(--text-3); padding: 3rem 1rem; font-size: 1rem; }
.search-result-item {
  display: flex; align-items: center; gap: 1rem; padding: 0.75rem; border-radius: var(--radius);
  background: var(--surface); margin-bottom: 0.5rem; border: 1px solid var(--glass-border);
  transition: background var(--transition), border-color var(--transition); max-width: 100%;
}
.search-result-item:hover { background: var(--surface-2); border-color: var(--primary); }
.search-result-item img { width: 56px; height: 80px; object-fit: cover; border-radius: var(--radius-sm); flex-shrink: 0; background: var(--surface-2); }
.search-result-info { min-width: 0; flex: 1; }
.search-result-title { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: clamp(0.875rem, 1.5vw, 1rem); }
.search-result-meta { font-size: 0.8rem; color: var(--text-3); margin-top: 0.25rem; }

/* ==================== HERO SLIDER ==================== */
.hero-section { margin-top: var(--header-height); }
.hero-slider {
  position: relative; width: 100%; height: clamp(520px, 75vh, 850px);
  overflow: hidden; background: var(--bg);
}
.hero-slide {
  position: absolute; inset: 0; opacity: 0;
  transition: opacity 0.7s ease, transform 0.7s ease;
  transform: scale(1.03); pointer-events: none;
  display: flex; align-items: flex-end;
}
.hero-slide.active { opacity: 1; transform: scale(1); pointer-events: auto; z-index: 2; }
.hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center 20%; }
.hero-vignette { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 0%, rgba(10,10,15,0.8) 40%, rgba(10,10,15,0.3) 100%); }
.hero-content { position: relative; z-index: 3; width: 100%; max-width: 900px; padding: clamp(1.5rem, 4vw, 3rem); padding-bottom: clamp(2rem, 5vw, 4rem); }
.hero-badge { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 0.75rem; }
.hero-title {
  font-size: clamp(2rem, 5vw, 4rem); font-weight: 800; line-height: 1.05; margin-bottom: 1rem;
  background: linear-gradient(to right, #fff, #e9d5ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.hero-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; font-size: clamp(0.8rem, 1.2vw, 0.95rem); color: var(--text-2); margin-bottom: 1.25rem; }
.hero-meta .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text-3); }
.hero-meta .score { color: #fbbf24; font-weight: 700; }
.hero-synopsis {
  font-size: clamp(0.85rem, 1.2vw, 1rem); color: var(--text-2); line-height: 1.6;
  max-width: 600px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 1.5rem;
}
.hero-buttons { display: flex; gap: 0.75rem; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  padding: 0.75rem 1.5rem; border-radius: var(--radius); font-weight: 600;
  font-size: clamp(0.85rem, 1vw, 0.95rem); border: none;
  transition: transform var(--transition), box-shadow var(--transition); white-space: nowrap;
}
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 20px var(--primary-glow); }
.btn-primary:hover { box-shadow: 0 6px 30px rgba(139,92,246,0.5); }
.btn-secondary { background: var(--glass); color: var(--text); border: 1px solid var(--glass-border); backdrop-filter: blur(10px); }
.btn-secondary:hover { background: var(--surface-2); border-color: var(--primary); }
.hero-nav { position: absolute; bottom: 2rem; right: clamp(1rem, 4vw, 3rem); z-index: 5; display: flex; gap: 0.75rem; }
.hero-nav-btn {
  width: 44px; height: 44px; border-radius: 50%; background: var(--glass); border: 1px solid var(--glass-border);
  color: white; display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: background var(--transition); backdrop-filter: blur(10px);
}
.hero-nav-btn:hover { background: var(--primary); border-color: var(--primary); }
.hero-dots { position: absolute; bottom: 2rem; left: clamp(1rem, 4vw, 3rem); z-index: 5; display: flex; gap: 0.5rem; }
.hero-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; transition: background var(--transition), transform var(--transition); }
.hero-dot.active { background: var(--primary); transform: scale(1.3); }
@media (max-width: 768px) {
  .hero-slider { height: clamp(480px, 85vh, 600px); }
  .hero-nav { bottom: 1rem; right: 1rem; } .hero-dots { bottom: 1rem; left: 1rem; }
  .hero-nav-btn { width: 38px; height: 38px; }
}

/* ==================== WIDGETS & CAROUSEL ==================== */
.section { padding: 2rem 0; }
.widget-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
.widget-link { font-size: 0.85rem; color: var(--primary); font-weight: 600; }
.slider-container { position: relative; width: 100%; overflow: hidden; }
.slider-track {
  display: flex; gap: var(--gap); overflow-x: auto; scroll-snap-type: x mandatory;
  scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 4px 0;
}
.slider-track::-webkit-scrollbar { display: none; }
.slider-btn {
  position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px;
  border-radius: 50%; background: var(--glass); border: 1px solid var(--glass-border); color: white;
  display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; opacity: 0;
  transition: opacity var(--transition), background var(--transition); backdrop-filter: blur(8px);
}
.slider-container:hover .slider-btn { opacity: 1; }
.slider-btn:hover { background: var(--primary); border-color: var(--primary); }
.slider-btn.prev { left: 8px; } .slider-btn.next { right: 8px; }
@media (max-width: 768px) { .slider-btn { display: none; } }

/* ==================== ANIME CARD ==================== */
.anime-card {
  position: relative; border-radius: var(--radius); overflow: hidden; background: var(--surface);
  cursor: pointer; flex: 0 0 auto;
  width: calc((100% - (var(--visible, 6) - 1) * var(--gap)) / var(--visible, 6));
  scroll-snap-align: start;
  transition: transform var(--transition), box-shadow var(--transition); border: 1px solid var(--glass-border);
}
.anime-card:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 20px var(--primary-glow); border-color: rgba(139,92,246,0.3);
}
.card-image-wrapper { position: relative; aspect-ratio: 2/3; overflow: hidden; }
.card-image-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--transition); }
.anime-card:hover .card-image-wrapper img { transform: scale(1.08); }
.card-badges { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 4px; z-index: 2; }
.badge { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 6px; border-radius: 4px; backdrop-filter: blur(4px); }
.badge-score { background: rgba(0,0,0,0.75); color: #fbbf24; }
.badge-eps { background: rgba(0,0,0,0.75); color: white; }
.badge-type { background: rgba(255,255,255,0.2); color: white; }
.badge-hd { background: var(--primary); color: white; }
.card-overlay { position: absolute; inset: 0; background: rgba(10,10,15,0.4); opacity: 0; transition: opacity var(--transition); display: flex; align-items: center; justify-content: center; }
.anime-card:hover .card-overlay { opacity: 1; }
.card-play { width: 48px; height: 48px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px var(--primary-glow); transform: scale(0.8); transition: transform var(--transition); }
.anime-card:hover .card-play { transform: scale(1); }
.card-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, transparent 100%); }
.card-title { font-size: clamp(0.75rem, 0.9vw, 0.9rem); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }

/* ==================== SKELETON ==================== */
.skeleton-card { background: var(--surface); border: 1px solid var(--glass-border); pointer-events: none; }
.skeleton-img { width: 100%; aspect-ratio: 2/3; background: linear-gradient(90deg, var(--surface-2) 25%, #252530 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
.skeleton-text { height: 16px; margin: 10px; background: linear-gradient(90deg, var(--surface-2) 25%, #252530 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ==================== FOOTER ==================== */
.footer { border-top: 1px solid var(--glass-border); padding: 2rem clamp(1rem, 3vw, 2rem); text-align: center; color: var(--text-3); font-size: 0.85rem; margin-top: 2rem; }
.footer-social { display: flex; justify-content: center; gap: 1rem; margin-bottom: 1rem; }
.footer-social a { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; color: var(--text-2); transition: color var(--transition), border-color var(--transition); }
.footer-social a:hover { color: var(--primary); border-color: var(--primary); }

/* ==================== RESPONSIVE CARD COUNT ==================== */
@media (max-width: 480px) { :root { --gap: 10px; } .hero-title { font-size: 1.6rem; } .hero-synopsis { -webkit-line-clamp: 2; } }
@media (max-width: 768px) { .anime-card { width: calc((100% - (3 - 1) * var(--gap)) / 3); } }
@media (min-width: 769px) and (max-width: 1024px) { .anime-card { width: calc((100% - (4 - 1) * var(--gap)) / 4); } }
@media (min-width: 1025px) and (max-width: 1440px) { .anime-card { width: calc((100% - (5 - 1) * var(--gap)) / 5); } }
@media (min-width: 1441px) { .anime-card { width: calc((100% - (6 - 1) * var(--gap)) / 6); } }
</style>
</head>

<script>
/* ==================== API LAYER ==================== */
class JikanAPI {
  constructor() {
    this.base = 'https://api.jikan.moe/v4';
    this.prefix = 'af_cache_';
    this.ttl = 8 * 60 * 1000; // 8 min cache
    this.timeout = 10000;
    this.retries = 3;
    this.delay = 1200;
  }
  key(ep) { return this.prefix + ep.replace(/[^a-zA-Z0-9]/g, '_'); }
  getCache(ep) {
    try {
      const raw = localStorage.getItem(this.key(ep));
      if (!raw) return null;
      const p = JSON.parse(raw);
      if (Date.now() - p.ts > this.ttl) return null;
      return p.data;
    } catch (e) { return null; }
  }
  setCache(ep, data) {
    try { localStorage.setItem(this.key(ep), JSON.stringify({ data, ts: Date.now() })); } catch (e) {}
  }
  async fetch(url, signal) {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), this.timeout);
    try { const r = await fetch(url, { signal: signal || c.signal }); clearTimeout(t); return r; }
    catch (e) { clearTimeout(t); throw e; }
  }
  async get(ep, signal) {
    const cached = this.getCache(ep);
    if (cached) return cached;
    let lastErr;
    for (let i = 0; i < this.retries; i++) {
      try {
        if (i > 0) await new Promise(r => setTimeout(r, i * this.delay));
        const r = await this.fetch(`${this.base}${ep}`, signal);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        if (!j || !j.data) throw new Error('Empty');
        this.setCache(ep, j.data);
        return j.data;
      } catch (e) {
        lastErr = e;
        if (e.name === 'AbortError') console.warn('Timeout', ep);
        else console.warn(`Retry ${i + 1} failed`, ep, e.message);
      }
    }
    console.error('API failed', ep, lastErr);
    return null;
  }
}

/* ==================== UTILS ==================== */
const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));
const debounce = (fn, ms = 300) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ==================== LAZY LOAD ==================== */
function initLazy() {
  if (!('IntersectionObserver' in window)) {
    $$('img[data-src]').forEach(img => { img.src = img.dataset.src; img.removeAttribute('data-src'); });
    return;
  }
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        const img = en.target;
        if (img.dataset.src) { img.src = img.dataset.src; img.removeAttribute('data-src'); }
        obs.unobserve(img);
      }
    });
  }, { rootMargin: '60px' });
  $$('img[data-src]').forEach(img => obs.observe(img));
}

/* ==================== SLIDER SYSTEM ==================== */
class SliderSystem {
  constructor(el, mode = 'carousel', opts = {}) {
    this.container = typeof el === 'string' ? $(el) : el;
    if (!this.container) return;
    this.mode = mode;
    this.track = this.container.querySelector('.slider-track');
    if (!this.track && mode === 'carousel') return;
    this.opts = { gap: 16, visible: 6, autoplay: false, interval: 6000, ...opts };
    this.current = 0; this.timer = null;
    this.init();
  }
  init() {
    if (this.mode === 'carousel') this.updateVisible();
    else this.setupHero();
    this.bind();
    if (this.opts.autoplay) this.startAuto();
    if (window.ResizeObserver) {
      this.ro = new ResizeObserver(() => { if (this.mode === 'carousel') this.updateVisible(); });
      this.ro.observe(this.container);
    }
  }
  updateVisible() {
    const w = this.container.clientWidth;
    let v = this.opts.visible;
    if (w < 480) v = 2; else if (w < 768) v = 3; else if (w < 1024) v = 4; else if (w < 1440) v = 5; else v = 6;
    this.container.style.setProperty('--visible', v);
  }
  setupHero() {
    this.slides = Array.from(this.container.children).filter(c => c.classList.contains('hero-slide'));
    this.dots = Array.from(this.container.querySelectorAll('.hero-dot'));
    this.show(0);
  }
  show(idx) {
    if (!this.slides) return;
    this.slides.forEach((s, i) => s.classList.toggle('active', i === idx));
    if (this.dots) this.dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    this.current = idx;
  }
  next() {
    if (this.mode === 'hero') {
      let n = this.current + 1; if (n >= this.slides.length) n = 0; this.show(n); this.resetAuto();
    } else {
      const c = this.track.children[0]; if (!c) return;
      this.track.scrollBy({ left: (c.offsetWidth + this.opts.gap) * Math.max(1, Math.floor(this.container.clientWidth / c.offsetWidth)), behavior: 'smooth' });
    }
  }
  prev() {
    if (this.mode === 'hero') {
      let p = this.current - 1; if (p < 0) p = this.slides.length - 1; this.show(p); this.resetAuto();
    } else {
      const c = this.track.children[0]; if (!c) return;
      this.track.scrollBy({ left: -(c.offsetWidth + this.opts.gap) * Math.max(1, Math.floor(this.container.clientWidth / c.offsetWidth)), behavior: 'smooth' });
    }
  }
  startAuto() {
    if (this.timer) clearInterval(this.timer);
    this.timer = setInterval(() => this.next(), this.opts.interval);
    this.container.addEventListener('mouseenter', () => clearInterval(this.timer));
    this.container.addEventListener('mouseleave', () => this.startAuto());
  }
  resetAuto() { if (this.opts.autoplay) { clearInterval(this.timer); this.timer = setInterval(() => this.next(), this.opts.interval); } }
  bind() {
    const nxt = this.container.querySelector('.slider-next, .hero-next, [data-dir="next"]');
    const prv = this.container.querySelector('.slider-prev, .hero-prev, [data-dir="prev"]');
    if (nxt) nxt.addEventListener('click', () => this.next());
    if (prv) prv.addEventListener('click', () => this.prev());

    // Drag / touch
    let isDown = false, startX, scrollLeft;
    const t = this.mode === 'carousel' ? this.track : this.container;
    if (this.mode === 'carousel') {
      t.addEventListener('mousedown', e => { isDown = true; t.style.cursor = 'grabbing'; startX = e.pageX - t.offsetLeft; scrollLeft = t.scrollLeft; });
      t.addEventListener('mouseleave', () => { isDown = false; t.style.cursor = 'grab'; });
      t.addEventListener('mouseup', () => { isDown = false; t.style.cursor = 'grab'; });
      t.addEventListener('mousemove', e => { if (!isDown) return; e.preventDefault(); const x = e.pageX - t.offsetLeft; t.scrollLeft = scrollLeft - (x - startX) * 1.5; });
    }
    let touchStart = 0;
    t.addEventListener('touchstart', e => { touchStart = e.changedTouches[0].screenX; }, { passive: true });
    t.addEventListener('touchend', e => {
      const diff = touchStart - e.changedTouches[0].screenX;
      if (Math.abs(diff) > 50 && this.mode === 'hero') diff > 0 ? this.next() : this.prev();
    }, { passive: true });

    if (this.mode === 'hero') {
      document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') this.next(); if (e.key === 'ArrowLeft') this.prev(); });
    }
  }
}

/* ==================== SEARCH OVERLAY ==================== */
class SearchOverlay {
  constructor(api) {
    this.api = api;
    this.overlay = $('#search-overlay');
    this.input = $('#search-input');
    this.results = $('#search-results');
    this.openBtn = $('#search-btn');
    this.closeBtn = $('#search-close');
    this.debounceTimer = null;
    this.isOpen = false;
    this.bind();
  }
  bind() {
    this.openBtn.addEventListener('click', () => this.open());
    this.closeBtn.addEventListener('click', () => this.close());
    this.overlay.addEventListener('click', e => { if (e.target === this.overlay) this.close(); });
    this.input.addEventListener('input', e => this.onInput(e.target.value));
    document.addEventListener('keydown', e => {
      if (e.key === '/' && !this.isOpen) { e.preventDefault(); this.open(); }
      if (e.key === 'Escape' && this.isOpen) this.close();
    });
  }
  open() { this.isOpen = true; this.overlay.classList.add('active'); document.body.style.overflow = 'hidden'; setTimeout(() => this.input.focus(), 50); }
  close() { this.isOpen = false; this.overlay.classList.remove('active'); document.body.style.overflow = ''; this.input.value = ''; this.results.innerHTML = ''; }
  onInput(q) {
    clearTimeout(this.debounceTimer);
    if (!q.trim()) { this.results.innerHTML = ''; return; }
    this.results.innerHTML = '<div class="search-loading">Searching...</div>';
    this.debounceTimer = setTimeout(() => this.search(q.trim()), 350);
  }
  async search(q) {
    const data = await this.api.get(`/anime?q=${encodeURIComponent(q)}&limit=10&sfw=true`);
    if (!data || !data.length) { this.results.innerHTML = '<div class="search-empty">No anime found. Try another title.</div>'; return; }
    this.results.innerHTML = '';
    const frag = document.createDocumentFragment();
    data.forEach(a => {
      const el = document.createElement('a');
      el.className = 'search-result-item';
      el.href = `anime.html?id=${a.mal_id}`;
      const img = a.images?.jpg?.image_url || '';
      const title = a.title_english || a.title || 'Unknown';
      el.innerHTML = `<img src="${img}" alt="" loading="lazy" onerror="this.style.display='none'"><div class="search-result-info"><div class="search-result-title">${title}</div><div class="search-result-meta">${a.type || 'TV'} • ${a.score ? '★ ' + a.score : 'No score'}</div></div>`;
      frag.appendChild(el);
    });
    this.results.appendChild(frag);
  }
}

/* ==================== CARD FACTORY ==================== */
function createCard(a) {
  const el = document.createElement('div');
  el.className = 'anime-card';
  el.setAttribute('role', 'button'); el.setAttribute('tabindex', '0');
  el.onclick = () => location.href = `anime.html?id=${a.mal_id}`;
  el.onkeydown = e => { if (e.key === 'Enter') el.click(); };
  const img = a.images?.jpg?.large_image_url || a.images?.jpg?.image_url || '';
  const title = a.title_english || a.title || 'Unknown';
  const score = a.score ? a.score.toFixed(1) : 'N/A';
  const eps = a.episodes || '?';
  const type = a.type || 'TV';
  el.innerHTML = `
    <div class="card-image-wrapper">
      <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" data-src="${img}" alt="${title.replace(/"/g, '&quot;')}" class="lazy-img" loading="lazy">
      <div class="card-badges">
        <span class="badge badge-score">★ ${score}</span>
        <span class="badge badge-type">${type}</span>
        ${eps !== '?' ? `<span class="badge badge-eps">${eps} EPS</span>` : ''}
        <span class="badge badge-hd">HD</span>
      </div>
      <div class="card-overlay"><div class="card-play"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg></div></div>
    </div>
    <div class="card-info"><div class="card-title" title="${title.replace(/"/g, '&quot;')}">${title}</div></div>
  `;
  return el;
}
function renderSkeletons(container, count = 12) {
  container.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const d = document.createElement('div'); d.className = 'anime-card skeleton-card';
    d.innerHTML = '<div class="skeleton-img"></div><div class="skeleton-text"></div>';
    container.appendChild(d);
  }
}
function renderErrorState(container, msg = 'Failed to load') {
  container.innerHTML = `<div style="padding:2rem;color:var(--text-3);text-align:center;width:100%;">${msg}</div>`;
}

/* ==================== SIDEBAR ==================== */
function initSidebar() {
  const menu = $('#menu-btn'), sidebar = $('#sidebar'), overlay = $('#sidebar-overlay'), close = $('#sidebar-close');
  const open = () => { sidebar.classList.add('active'); overlay.classList.add('active'); document.body.style.overflow = 'hidden'; };
  const closeFn = () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); document.body.style.overflow = ''; };
  menu.addEventListener('click', open);
  close.addEventListener('click', closeFn);
  overlay.addEventListener('click', closeFn);
}

/* ==================== CAROUSEL BUTTONS ==================== */
function initCarouselButtons() {
  $$('.slider-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetId = btn.getAttribute('data-target');
      const track = $('#' + targetId);
      if (!track) return;
      const card = track.children[0];
      if (!card) return;
      const amount = (card.offsetWidth + 16) * Math.max(1, Math.floor(track.parentElement.clientWidth / card.offsetWidth));
      track.scrollBy({ left: btn.classList.contains('prev') ? -amount : amount, behavior: 'smooth' });
    });
  });
}

/* ==================== HERO RENDER ==================== */
function renderHero(slides) {
  const track = $('#hero-slider');
  const dots = $('#hero-dots');
  const skel = $('#hero-skeleton'); if (skel) skel.remove();
  if (!slides || !slides.length) {
    track.innerHTML = '<div class="hero-slide active"><div class="hero-bg" style="background:var(--surface)"></div><div class="hero-vignette"></div><div class="hero-content"><h2 style="color:var(--text-2)">Could not load featured anime</h2></div></div>' + track.innerHTML;
    return;
  }
  const frag = document.createDocumentFragment();
  const dotFrag = document.createDocumentFragment();
  slides.forEach((a, i) => {
    const slide = document.createElement('div');
    slide.className = 'hero-slide' + (i === 0 ? ' active' : '');
    const img = a.images?.jpg?.large_image_url || a.images?.jpg?.image_url || '';
    const title = a.title_english || a.title || 'Unknown';
    const synopsis = a.synopsis ? a.synopsis.substring(0, 220) + (a.synopsis.length > 220 ? '...' : '') : 'No synopsis available.';
    const genres = (a.genres || []).map(g => g.name).slice(0, 3).join(', ') || 'Anime';
    const score = a.score ? a.score.toFixed(1) : 'N/A';
    slide.innerHTML = `
      <div class="hero-bg" style="background-image:url('${img}')"></div>
      <div class="hero-vignette"></div>
      <div class="hero-content">
        <div class="hero-badge"><span style="color:var(--primary)">⬤</span> ${genres}</div>
        <h1 class="hero-title">${title}</h1>
        <div class="hero-meta">
          <span class="score">★ ${score}</span><span class="dot"></span>
          <span>${a.type || 'TV'}</span><span class="dot"></span>
          <span>${a.episodes || '?'} Episodes</span><span class="dot"></span>
          <span>${a.aired?.string?.split(' to ')[0] || 'Unknown'}</span>
        </div>
        <p class="hero-synopsis">${synopsis}</p>
        <div class="hero-buttons">
          <a href="watch.html?id=${a.mal_id}&ep=1" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Watch Now
          </a>
          <a href="anime.html?id=${a.mal_id}" class="btn btn-secondary">Details</a>
        </div>
      </div>
    `;
    frag.appendChild(slide);
    const dot = document.createElement('button');
    dot.className = 'hero-dot' + (i === 0 ? ' active' : '');
    dot.setAttribute('aria-label', `Go to slide ${i + 1}`);
    dot.addEventListener('click', () => window.heroSlider.show(i));
    dotFrag.appendChild(dot);
  });
  track.insertBefore(frag, dots);
  dots.innerHTML = ''; dots.appendChild(dotFrag);
  window.heroSlider = new SliderSystem('#hero-slider', 'hero', { autoplay: true, interval: 6500 });
}

/* ==================== WIDGET LOADER ==================== */
async function loadWidgets(api) {
  const widgets = [
    { id: 'recent', ep: '/seasons/now?limit=15&sfw=true' },
    { id: 'trending', ep: '/top/anime?filter=airing&limit=15&sfw=true' },
    { id: 'top', ep: '/top/anime?limit=15&sfw=true' },
    { id: 'airing', ep: '/top/anime?filter=airing&limit=15&sfw=true' },
    { id: 'upcoming', ep: '/top/anime?filter=upcoming&limit=15&sfw=true' },
    { id: 'completed', ep: '/anime?status=complete&order_by=score&sort=desc&limit=15&sfw=true' }
  ];
  widgets.forEach(w => renderSkeletons($('#' + w.id + '-track'), 12));
  const results = await Promise.allSettled(widgets.map(w => api.get(w.ep)));
  widgets.forEach((w, i) => {
    const track = $('#' + w.id + '-track');
    const res = results[i];
    if (res.status === 'fulfilled' && res.value && res.value.length) {
      track.innerHTML = '';
      const frag = document.createDocumentFragment();
      const list = Array.isArray(res.value) ? res.value : (res.value.data || []);
      list.slice(0, 15).forEach(a => frag.appendChild(createCard(a)));
      track.appendChild(frag);
    } else {
      renderErrorState(track, 'Could not load ' + w.id);
    }
  });
  initLazy();
  initCarouselButtons();
}

/* ==================== BOOT ==================== */
(async function () {
  const api = new JikanAPI();
  initSidebar();
  new SearchOverlay(api);
  const heroData = await api.get('/top/anime?filter=airing&limit=15&sfw=true');
  renderHero(heroData);
  await loadWidgets(api);
  window.addEventListener('orientationchange', () => setTimeout(() => {
    if (window.heroSlider) window.heroSlider.updateVisible && window.heroSlider.updateVisible();
    $$('.slider-container').forEach(c => c.__slider && c.__slider.updateVisible && c.__slider.updateVisible());
  }, 300));
})();
</script>
</body>
</html>
